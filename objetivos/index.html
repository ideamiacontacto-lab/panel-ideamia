<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="robots" content="noindex">
<title>Objetivos · Ideamia</title>
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
:root{--bg:#0A0A0A;--c1:#141414;--c2:#1C1C1C;--c3:#242424;--ln:#262626;--tx:#F5F5F5;--mu:#8C8C8C;--y:#FFF200;--ok:#5CE38A;--warn:#FFB454;--bad:#FF6B6B;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.45 Outfit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--y)}button,input{font:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 70px}
.kick{color:var(--mu);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
h1{font:400 40px/1 'Bebas Neue',sans-serif;letter-spacing:.02em;margin:4px 0 2px}h1 b{color:var(--y);font-weight:400}
.sub{color:var(--mu);margin:0 0 14px;font-size:14px}
/* carrusel de marcas */
.marcas{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px 6px}.marcas::-webkit-scrollbar{display:none}
.mc{scroll-snap-align:start;flex:none;display:flex;align-items:center;gap:9px;border:1px solid var(--ln);background:var(--c1);border-radius:16px;padding:8px 14px 8px 8px;transition:all .18s;text-align:left}
.mc:hover{border-color:#3a3a3a}.mc.on{background:var(--y);color:#0A0A0A;border-color:var(--y)}
.mc .n{font-weight:700;font-size:14px;white-space:nowrap}.mc .s{font-size:11.5px;opacity:.7;white-space:nowrap}
.ring{--p:0;width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),#2c2c2c 0);display:grid;place-items:center;flex:none}
.ring i{width:26px;height:26px;border-radius:50%;background:var(--c1);display:grid;place-items:center;font:700 10px Outfit;font-style:normal;color:var(--tx)}
.mc.on .ring i{background:var(--y);color:#0A0A0A}.mc.on .ring{background:conic-gradient(#0A0A0A calc(var(--p)*1%),rgba(0,0,0,.18) 0)}
/* plegables */
.fold{background:var(--c1);border:1px solid var(--ln);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.fold>.fh{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:13px 16px;text-align:left}
.fh .t{flex:1;font-weight:600}.fh .cnt{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--c3)}
.fh .chev{transition:transform .25s;color:var(--mu)}.fold.open>.fh .chev{transform:rotate(180deg)}
.fb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}.fold.open>.fb{grid-template-rows:1fr}
.fb>div{overflow:hidden}.fb ul{margin:0;padding:0 16px 14px 34px}.fb li{margin:6px 0;color:#d6d6d6;font-size:14px}
.fold.amar{border-color:rgba(255,242,0,.3)}.fold.amar .cnt{background:var(--y);color:#0A0A0A}
.fold.roja .cnt{background:rgba(255,107,107,.18);color:var(--bad)}
/* solapas de período + carrusel */
.ptabs{display:flex;gap:6px;background:var(--c1);border:1px solid var(--ln);border-radius:14px;padding:4px;margin:14px 0 10px}
.pt{flex:1;border:0;background:none;border-radius:10px;padding:8px 6px;font-weight:600;font-size:13.5px;color:var(--mu);transition:all .18s;line-height:1.2}
.pt b{display:block;font-size:11.5px;font-weight:500;opacity:.8}.pt.on{background:var(--c3);color:var(--tx)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth;gap:16px}.track::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 0}.dots i{width:6px;height:6px;border-radius:9px;background:#333;transition:all .2s}.dots i.on{width:18px;background:var(--y)}
.phead{display:block;width:100%;text-align:left;background:var(--c1);border:1px solid var(--ln);border-radius:var(--r);padding:15px 16px;margin-bottom:10px;transition:border-color .2s}
.phead:hover{border-color:#353535}.phead .row>.chev{align-self:center;color:var(--mu);transition:transform .25s;flex:none}.panel.min .phead .row>.chev{transform:rotate(-90deg)}
.pbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease}.pbody>div{overflow:hidden}.panel.min .pbody{grid-template-rows:0fr}
.phead .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.phead h2{margin:2px 0 0;font-size:17px;font-weight:700}.phead .d{color:var(--mu);font-size:12.5px}
.bono{text-align:right;flex:none}.bono .n{font:400 32px/1 'Bebas Neue',sans-serif;color:var(--y)}.bono .n small{font-size:17px;color:var(--mu)}.bono .l{color:var(--mu);font-size:11.5px}
.tbar{height:4px;background:var(--c2);border-radius:9px;margin:12px 0 4px;overflow:hidden}.tbar i{display:block;height:100%;background:#444}
.tlbl{color:var(--mu);font-size:11.5px}
/* objetivos plegables */
.obj{background:var(--c1);border:1px solid var(--ln);border-radius:16px;margin-bottom:8px;overflow:hidden;transition:border-color .2s}
.obj.open{border-color:#353535}
.oh{width:100%;background:none;border:0;padding:12px 14px;display:grid;grid-template-columns:10px 1fr auto 14px;gap:10px;align-items:center;text-align:left}
.dot{width:10px;height:10px;border-radius:50%}.dot.ok{background:var(--ok)}.dot.cam{background:var(--y)}.dot.at{background:var(--bad)}.dot.va{background:var(--warn)}.dot.nd{background:#555}
.ot{font-weight:600;font-size:14.5px;line-height:1.25}.mini{height:4px;background:var(--c2);border-radius:9px;margin-top:6px;overflow:hidden}.mini i{display:block;height:100%;background:var(--y);border-radius:9px}.mini i.ok{background:var(--ok)}.mini i.at{background:var(--bad)}
.ov{font-size:12.5px;color:var(--mu);text-align:right;white-space:nowrap}.ov strong{color:var(--tx);font-size:14px}
.oh .chev{color:var(--mu);transition:transform .25s}.obj.open .oh .chev{transform:rotate(180deg)}
.ob{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}.obj.open .ob{grid-template-rows:1fr}.ob>div{overflow:hidden}
.oin{padding:0 14px 14px}
.full{font-size:13.5px;color:#d0d0d0}.on{color:var(--mu);font-size:12.5px;margin-top:4px}
.st{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;margin-top:8px}
.st.ok{background:rgba(92,227,138,.14);color:var(--ok)}.st.cam{background:rgba(255,242,0,.12);color:var(--y)}.st.at{background:rgba(255,107,107,.14);color:var(--bad)}.st.nd{background:var(--c2);color:var(--mu)}.st.va{background:rgba(255,180,84,.14);color:var(--warn)}
.bar{height:10px;background:var(--c2);border-radius:9px;margin:12px 0 6px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--y)}.bar i.ok{background:var(--ok)}.bar i.at{background:var(--bad)}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.55}
.nums{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu);gap:10px;flex-wrap:wrap}.nums strong{color:var(--tx)}
.meses{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}.meses::-webkit-scrollbar{display:none}
.mes{flex:none;font-size:12px;border:1px solid var(--ln);border-radius:12px;padding:6px 10px;color:var(--mu);background:var(--c2)}.mes b{color:var(--tx);display:block;font-size:13px}
.mes.bajo{border-color:rgba(255,107,107,.5)}.mes.bajo b{color:var(--bad)}.mes.okm b{color:var(--ok)}.mes.falta{border-style:dashed}
.mes button{background:none;border:0;padding:0;color:var(--y);font-weight:700;font-size:12.5px}
.hint{margin-top:10px;font-size:13px;color:#cfcfcf;background:var(--c2);border-radius:12px;padding:9px 12px}
.reels{margin-top:10px;font-size:13px;color:var(--mu)}.reels li{margin:4px 0}
.anot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.anot input{background:var(--c2);border:1px solid var(--ln);border-radius:12px;padding:9px 12px;min-width:0}
.anot input.n{width:140px}.anot input.t{flex:1;min-width:150px}
.btn{background:var(--y);color:#0A0A0A;border:0;border-radius:12px;padding:9px 16px;font-weight:700}.btn:disabled{opacity:.5}
.btn.g{background:var(--c3);color:var(--tx)}
.who{font-size:11.5px;color:var(--mu);margin-top:6px}
.todo{display:flex;justify-content:flex-end;gap:6px;margin-bottom:6px}.todo button{background:none;border:0;color:var(--mu);font-size:12.5px;padding:4px 6px}.todo button:hover{color:var(--tx)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.ayuda{font-size:13px;padding:8px 12px;flex:none}.modal .box p{font-size:14px;color:#d6d6d6;line-height:1.5;margin:8px 0}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
.gate{max-width:380px;margin:40px auto;text-align:center}.gate input{width:100%;background:var(--c2);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:12px 0}
.ps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid var(--ln);background:var(--c1);border-radius:999px;padding:8px 14px;font-weight:600}.chip.on{background:var(--y);color:#0A0A0A}
.pie{color:var(--mu);font-size:12px;margin-top:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:end center;z-index:20;animation:fo .2s}
.modal .box{background:var(--c1);border:1px solid var(--ln);border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:520px;animation:up .25s ease}
@media(min-width:700px){.modal{place-items:center}.modal .box{border-radius:20px}}
.modal h3{margin:0 0 4px}.modal p{color:var(--mu);margin:0 0 12px;font-size:13.5px}.modal input{width:100%;background:var(--c2);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.modal .acc{display:flex;gap:8px;justify-content:flex-end}
@keyframes fo{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--c3);border:1px solid var(--ln);border-radius:12px;padding:10px 16px;font-size:14px;z-index:30;animation:fo .2s}
@media(max-width:600px){h1{font-size:34px}.wrap{padding-top:14px}.anot input.n{width:120px}.pt{font-size:12.5px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* embebido en el panel (pestañas Plan y Objetivos): sin título propio */
.embed #app>.kick:first-child,.embed .top h1{display:none}.embed .top{justify-content:flex-end}.embed .wrap{padding-top:10px}
</style>
<script>/* desde el 22/10/2026 esta página vive adentro del panel (pestaña Objetivos): abierta sola, redirige al panel con los mismos datos */
if (window.self === window.top && !/[?&](embed|solo|demo)=1/.test(location.search)) { const q = new URLSearchParams(location.search), r = new URLSearchParams({ tab: 'okr' }); ['p', 'marca', 'vista'].forEach(k => { if (q.get(k)) r.set(k, q.get(k)); }); location.replace('../?' + r.toString()); }
if (window.self !== window.top || /[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');</script>
<script src="../config.js?v=2"></script>
<script src="../ideamia-nav.js?v=7" defer></script>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Cargando objetivos…</div></div>
<script>
(function () {
  const C = window.PANEL_CONFIG || {}, app = document.getElementById('app');
  // si el navegador mostró una copia vieja de la página, se pide la nueva una sola vez (cambiar VER en cada versión)
  const VER = '7';
  try {
    fetch(location.pathname + '?nocache=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => {
      const m = /const VER = '(\d+)'/.exec(t);
      if (m && m[1] !== VER && sessionStorage.getItem('okr:recargo') !== m[1]) { sessionStorage.setItem('okr:recargo', m[1]); location.replace(location.pathname + '?' + (s => { s.set('v', m[1]); return s.toString(); })(new URLSearchParams(location.search))); }
    }).catch(() => {});
  } catch (e) {}
  const lsGet = k => { try { const v = localStorage.getItem(k); return v == null ? '' : v; } catch (e) { return ''; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const jget = k => { const v = lsGet(k); try { return v ? JSON.parse(v) : ''; } catch (e) { return v; } };
  const S = { persona: new URLSearchParams(location.search).get('p') || jget('pi:persona') || lsGet('ideamia:persona') || '', key: jget('pi:key') || lsGet('ideamia:clave') || '', pkey: jget('pi:pkey') || '', data: null,
    marca: lsGet('okr:marca'), per: jget('okr:per') || {}, abiertos: jget('okr:abiertos') || {}, folds: jget('okr:folds') || {} };
  const PERMITIDAS = { orne: 'Orne', rama: 'Rama', project: 'Joaquín', joaco: 'Joaquín (prueba)' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => n == null ? '–' : Number(n).toLocaleString('es-AR', { maximumFractionDigits: 1 });
  const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'], MESL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const fecha = s => { const [y, m, d] = String(s).split('-').map(Number); return d + ' ' + MES[m - 1]; };
  const mesN = s => MES[Number(String(s).slice(5, 7)) - 1], mesL = s => MESL[Number(String(s).slice(5, 7)) - 1];
  const corto = t => String(t).split(':')[0].replace(/\(.*?\)/g, '').trim();
  const CHEV = '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';
  const toast = t => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3000); };
  const clave = () => S.persona === 'project' ? (S.pkey || S.key) : S.key;
  const guardarUI = () => { lsSet('okr:per', JSON.stringify(S.per)); lsSet('okr:abiertos', JSON.stringify(S.abiertos)); lsSet('okr:folds', JSON.stringify(S.folds)); };

  function gate(msg) {
    app.innerHTML = '<div class="gate"><div class="kick">Ideamia</div><h1>Obje<b>tivos</b></h1>' + (msg ? '<p class="sub">' + esc(msg) + '</p>' : '') +
      (S.persona && PERMITIDAS[S.persona] ? '' : '<p class="sub">¿Quién sos?</p><div class="ps">' + Object.keys(PERMITIDAS).map(p => '<button class="chip' + (S.persona === p ? ' on' : '') + '" data-p="' + p + '">' + PERMITIDAS[p] + '</button>').join('') + '</div>') +
      '<input id="k" type="password" placeholder="' + (S.persona === 'project' ? 'Clave del project' : 'Clave del equipo') + '" autocomplete="current-password"><button class="btn" id="ent">Entrar</button></div>';
    app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { S.persona = b.dataset.p; gate(msg); });
    const ent = () => { const v = app.querySelector('#k').value.trim(); if (!v || !S.persona) return toast('Elegí quién sos y poné la clave'); if (S.persona === 'project') S.pkey = v; else { S.key = v; lsSet('ideamia:clave', v); } lsSet('ideamia:persona', S.persona); cargar(); };
    app.querySelector('#ent').onclick = ent; app.querySelector('#k').onkeydown = e => { if (e.key === 'Enter') ent(); };
  }
  async function cargar(silencioso) {
    if (!S.persona || !PERMITIDAS[S.persona]) return gate(S.persona ? 'Esta sección es solo para las social media y el project.' : '');
    if (!clave()) return gate('');
    if (!silencioso) app.innerHTML = '<div class="empty">Cargando objetivos…</div>';
    try {
      const r = await fetch(C.API_URL + '?' + new URLSearchParams({ action: 'okr', k: clave(), p: S.persona }), { cache: 'no-store' }).then(r => r.json());
      if (r.error) return gate(r.mensaje || r.error);
      S.data = r; pintar();
    } catch (e) { app.innerHTML = '<div class="empty">No se pudo cargar: ' + esc(e.message) + '. Probá de nuevo en un rato.</div>'; }
  }
  async function enviar(body) {
    const r = await fetch(C.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: 'okrAnotar', k: clave(), persona: S.persona }, body)) }).then(r => r.json());
    if (r.error) throw new Error(r.mensaje || r.error);
    return r;
  }

  function estado(o) {
    if (o.cumplido) return ['ok', 'Cumplido'];
    if (o.enCamino) return ['cam', 'Llegó a la meta · falta cerrar los meses'];
    if (o.logrado == null) return ['nd', o.manual ? 'Falta cargar' : 'Sin datos todavía'];
    if (o.mesesBajos && o.mesesBajos.length) return ['at', 'Un mes quedó bajo el mínimo'];
    if (o.atrasado) return ['at', 'Atrasado'];
    return ['va', 'En curso'];
  }
  const editableMes = o => ['seg_netos', 'contactos', 'alcance_suma'].indexOf(o.metrica) >= 0;
  function objetivo(o, p) {
    const [cl, txt] = estado(o), pct = o.meta ? Math.min(100, Math.max(0, (o.logrado || 0) / o.meta * 100)) : 0, u = o.metrica === 'conversion' ? ' %' : '';
    const abierto = !!S.abiertos[o.id], valor = o.metrica === 'manual' ? fmt(o.logrado || 0) + ' de ' + fmt(o.meta) : '<strong>' + fmt(o.logrado) + u + '</strong> / ' + fmt(o.meta) + u;
    let h = '<div class="obj' + (abierto ? ' open' : '') + '" data-o="' + esc(o.id) + '"><button class="oh" data-abrir="' + esc(o.id) + '" aria-expanded="' + abierto + '"><span class="dot ' + cl + '" title="' + esc(txt) + '"></span><span><span class="ot">' + esc(corto(o.objetivo)) + '</span><div class="mini"><i class="' + (o.cumplido ? 'ok' : o.atrasado ? 'at' : '') + '" style="width:' + pct + '%"></i></div></span><span class="ov">' + valor + '</span>' + CHEV + '</button><div class="ob"><div><div class="oin">';
    h += '<div class="full">' + esc(o.objetivo) + '</div>' + (o.nota ? '<div class="on">' + esc(o.nota) + '</div>' : '') + '<span class="st ' + cl + '">' + txt + '</span>';
    if (o.meta != null && o.metrica !== 'manual') {
      h += '<div class="bar"><i class="' + (o.cumplido ? 'ok' : o.atrasado ? 'at' : '') + '" style="width:' + pct + '%"></i>' + (p.abierto && !o.cumplido ? '<b style="left:' + Math.round(o.avanceTiempo * 100) + '%" title="Dónde deberías estar hoy"></b>' : '') + '</div>';
      h += '<div class="nums"><span><strong>' + fmt(o.logrado) + u + '</strong> de ' + fmt(o.meta) + u + (o.base ? ' · incluye ' + fmt(o.base) + ' de antes' : '') + '</span><span>' + Math.round(pct) + ' %' + (p.abierto && !o.cumplido ? ' · la rayita blanca es dónde deberías estar hoy' : '') + '</span></div>';
    }
    if (o.meses && o.meses.length) h += '<div class="meses">' + o.meses.map(m => {
      const bajo = m.v != null && o.minMes && !m.parcial && m.v < o.minMes, okm = m.v != null && o.minMes && m.v >= o.minMes;
      const puede = editableMes(o) && !p.terminado && (m.v == null || m.aMano);
      return '<span class="mes' + (m.v == null ? ' falta' : bajo ? ' bajo' : okm ? ' okm' : '') + '" title="' + esc(m.fuente) + '">' + mesN(m.mes) + (o.minMes ? ' · mín. ' + fmt(o.minMes) : '') + '<b>' + (m.v == null ? 'sin reporte' : fmt(m.v)) + '</b>' + (m.parcial ? 'parcial (semanales)' : m.aMano ? 'cargado a mano' : '') + (puede ? ' <button data-mes="' + m.mes + '" data-oid="' + esc(o.id) + '">' + (m.v == null ? 'Cargar' : 'Cambiar') + '</button>' : '') + '</span>';
    }).join('') + '</div>';
    if (!o.cumplido && o.falta && p.abierto) h += '<div class="hint">Te faltan <b>' + fmt(o.falta) + '</b>' + (o.porMes && o.porMes !== o.falta ? ': unos <b>' + fmt(o.porMes) + ' por mes</b> en lo que queda' : '') + '.' + (o.atrasado ? ' Vas por debajo del ritmo: la pauta vale para este objetivo, coordinalo con Juan (ads).' : '') + '</div>';
    if (o.reels) h += '<div class="reels">' + (o.reels.length ? '<ul>' + o.reels.map(r => '<li>' + (r.link ? '<a href="' + esc(r.link) + '" target="_blank" rel="noopener">' + esc(r.desc || 'reel') + '</a>' : esc(r.desc || 'reel')) + ' · ' + fmt(r.v) + ' views</li>').join('') + '</ul>' : 'Todavía ningún reel cargado en los reportes llega a ' + fmt(o.umbral) + ' views.') + '<div class="who">Se cuentan los reels de los reportes semanales y mensuales (views orgánicas + pauta).</div></div>';
    if (o.manual && !o.cerrado && !p.terminado) {
      h += '<div class="anot"><input class="n" inputmode="decimal" placeholder="' + (o.metrica === 'alcance_esp' ? 'Espectadores' : 'Cuántas') + '" data-v="' + esc(o.id) + '" value="' + (o.logrado != null ? esc(o.logrado) : '') + '"><input class="t" placeholder="Nota (link, captura, campaña)" data-n="' + esc(o.id) + '" value="' + esc(o.anotado ? o.anotado.nota : '') + '"><button class="btn" data-g="' + esc(o.id) + '">Guardar</button></div>';
      if (o.anotado) h += '<div class="who">Cargado por ' + esc(PERMITIDAS[o.anotado.quien] || o.anotado.quien) + ' el ' + new Date(o.anotado.cuando).toLocaleDateString('es-AR') + '</div>';
    }
    return h + '</div></div></div></div>';
  }
  function avisos(m) {
    const iter = [], falta = [], hoyM = S.data.hoy.slice(0, 7);
    m.periodos.forEach(p => {
      if (!p.abierto && !(p.terminado && !p.reportePeriodo && p.pideReporte)) return;
      if (p.terminado && !p.reportePeriodo && p.pideReporte) falta.push('El reporte ' + p.tipo + ' de ' + esc(p.titulo.toLowerCase()) + ' (en Reportes).');
      p.objetivos.forEach(o => {
        if (o.cumplido) return;
        if (o.mesesBajos && o.mesesBajos.length) iter.push('<b>' + esc(corto(o.objetivo)) + '</b>: ' + o.mesesBajos.map(mesL).join(', ') + ' quedó abajo del mínimo (' + fmt(o.minMes) + '). Sostené el mínimo en los meses que quedan.');
        else if (o.atrasado) iter.push('<b>' + esc(corto(o.objetivo)) + '</b> (' + esc(p.tipo) + '): vas ' + fmt(o.logrado) + ' de ' + fmt(o.meta) + '; necesitás ~' + fmt(o.porMes) + ' por mes. Mirá qué contenido rindió en los reportes y sumá pauta con Juan si hace falta.');
        (o.faltanDatos || []).filter(x => x < hoyM).forEach(x => falta.push('El reporte mensual de ' + mesL(x) + ' (o cargá el número de <b>' + esc(corto(o.objetivo)).toLowerCase() + '</b> a mano).'));
        if (o.metrica === 'alcance_esp' && o.logrado == null && p.abierto) falta.push('Los espectadores del ' + esc(p.tipo === 'trimestral' ? 'trimestre' : p.tipo === 'semestral' ? 'semestre' : 'año') + ' a la fecha: Meta Business Suite > Estadísticas > Resultados > Instagram.');
      });
    });
    const u = a => a.filter((x, i) => a.indexOf(x) === i);
    const fold = (id, cl, t, L) => L.length ? '<div class="fold ' + cl + (S.folds[m.slug + id] ? ' open' : '') + '"><button class="fh" data-fold="' + m.slug + id + '"><span class="t">' + t + '</span><span class="cnt">' + L.length + '</span>' + CHEV + '</button><div class="fb"><div><ul>' + L.map(x => '<li>' + x + '</li>').join('') + '</ul></div></div></div>' : '';
    return fold(':falta', 'roja', 'Falta cargar para medir', u(falta)) + fold(':iter', 'amar', 'Para iterar', u(iter));
  }
  function pintar() {
    const D = S.data, con = D.marcas.filter(m => m.periodos.length), sin = D.marcas.filter(m => !m.periodos.length);
    if (!con.some(m => m.slug === S.marca)) S.marca = con.length ? con[0].slug : '';
    const m = con.filter(x => x.slug === S.marca)[0];
    let h = '<div class="kick">— ' + (D.project ? 'Vista Project · todas las marcas' : 'Tus marcas') + '</div><div class="top"><h1>Obje<b>tivos</b></h1><button class="btn g ayuda" data-guia>¿Cómo se lee?</button></div><p class="sub">Cómo venís con los OKR de cada marca. Tocá un objetivo para ver el detalle.</p>';
    h += '<div class="marcas">' + con.map(x => { const a = x.periodos.filter(p => p.abierto)[0] || x.periodos[0], pc = a ? Math.round(a.cumplidos / a.total * 100) : 0; return '<button class="mc' + (x.slug === S.marca ? ' on' : '') + '" data-m="' + x.slug + '"><span class="ring" style="--p:' + pc + '"><i>' + (a ? a.cumplidos + '/' + a.total : '') + '</i></span><span><span class="n">' + esc(x.nombre) + '</span><br><span class="s">' + (a ? esc(a.tipo) + ' · ' + fmt(a.logradoPct) + ' de ' + fmt(a.bono) + ' %' : '') + '</span></span></button>'; }).join('') + '</div>';
    if (!m) h += '<div class="fold"><div class="empty">Todavía no hay objetivos cargados para tus marcas.</div></div>';
    else {
      h += avisos(m);
      const P = m.periodos, sel = Math.min(S.per[m.slug] || 0, P.length - 1);
      if (P.length > 1) h += '<div class="ptabs" role="tablist">' + P.map((p, i) => '<button class="pt' + (i === sel ? ' on' : '') + '" data-pt="' + i + '" role="tab">' + esc(p.tipo.charAt(0).toUpperCase() + p.tipo.slice(1)) + '<b>' + p.cumplidos + '/' + p.total + ' · ' + fmt(p.logradoPct) + ' %' + (p.terminado ? ' · cerrado' : '') + '</b></button>').join('') + '</div>';
      h += '<div class="track" id="track">' + P.map((p, i) => {
        const t = p.abierto ? Math.round(p.objetivos[0].avanceTiempo * 100) : p.terminado ? 100 : 0, kp = m.slug + ':per' + i, min = !!S.folds[kp];
        // el encabezado del período se toca para minimizarlo (quedan solo el título y el bono) o volver a abrirlo
        return '<section class="panel' + (min ? ' min' : '') + '"><button class="phead" data-per="' + kp + '" aria-expanded="' + !min + '"><div class="row"><div><div class="kick">' + esc(p.tipo) + (p.terminado ? ' · cerrado' : p.abierto ? ' · en curso' : ' · todavía no empieza') + '</div><h2>' + esc(p.titulo) + '</h2><div class="d">' + fecha(p.desde) + ' al ' + fecha(p.hasta) + '</div></div>' +
          '<div class="bono"><div class="n">' + fmt(p.logradoPct) + '<small> / ' + fmt(p.bono) + ' %</small></div><div class="l">' + p.cumplidos + ' de ' + p.total + ' cumplidos</div></div>' + CHEV + '</div>' +
          '<div class="tbar"><i style="width:' + t + '%"></i></div><div class="tlbl">' + (p.abierto ? 'Pasó el ' + t + ' % del período' : p.terminado ? 'Período cerrado' : 'Empieza el ' + fecha(p.desde)) + ' · ' + (min ? 'tocá para ver los objetivos' : 'tocá para minimizar') + '</div></button>' +
          '<div class="pbody"><div><div class="todo"><button data-todos="1">Abrir todos</button><button data-todos="0">Cerrar todos</button></div>' + p.objetivos.map(o => objetivo(o, p)).join('') + '</div></div></section>';
      }).join('') + '</div>';
      if (P.length > 1) h += '<div class="dots">' + P.map((p, i) => '<i class="' + (i === sel ? 'on' : '') + '"></i>').join('') + '</div>';
    }
    if (sin.length && D.project) h += '<p class="pie">Sin objetivos cargados: ' + sin.map(x => esc(x.nombre)).join(', ') + '.</p>';
    h += '<p class="pie">Cada objetivo vale su parte del bono (trimestral 20 %, semestral 40 %, anual 70 % del salario de la marca). Último reporte mensual cargado: ' + (D.reportesHasta ? mesL(D.reportesHasta) : 'ninguno') + '.</p>';
    app.innerHTML = h;
    bind(m);
  }
  function bind(m) {
    app.querySelectorAll('[data-guia]').forEach(b => b.onclick = () => { const o = document.createElement('div'); o.className = 'modal'; o.innerHTML = '<div class="box"><h3>Cómo se leen tus objetivos</h3>' +      '<p><b>Arriba</b>, tus marcas: el circulito dice cuántos objetivos del período en curso ya cumpliste. <b>Abajo</b>, cada período (trimestral, semestral, anual) en su solapa: deslizá o tocá para cambiar.</p>' +      '<p><b>El número amarillo</b> es la parte del bono que ya tenés asegurada en ese período (cada objetivo vale su parte; trimestral 20 %, semestral 40 %, anual 70 % del salario de la marca).</p>' +      '<p><b>Cada objetivo</b> es una línea: punto verde cumplido, amarillo en curso, rojo atrasado, gris sin datos. Tocalo para ver el detalle: la barra, la rayita blanca (dónde deberías estar hoy), los meses y cuánto te falta por mes.</p>' +      '<p><b>De dónde salen los números:</b> solos, de tus reportes semanales, mensuales y trimestrales. Si a un mes le falta el reporte, tocá <b>Cargar</b> y ponés el número a mano. Los espectadores del período (Meta) y las campañas cumplidas los cargás vos en el objetivo.</p>' +      '<p><b>Falta cargar</b> y <b>Para iterar</b> te dicen qué te falta para medir y qué viene atrasado. La pauta vale para cualquier objetivo: coordinala con Juan.</p>' +      '<div class="acc"><button class="btn" data-x>Entendido</button></div></div>'; o.onclick = e => { if (e.target === o || e.target.closest('[data-x]')) o.remove(); }; document.body.appendChild(o); });
    app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.marca = b.dataset.m; lsSet('okr:marca', S.marca); pintar(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    app.querySelectorAll('[data-fold]').forEach(b => b.onclick = () => { const f = b.parentElement, k = b.dataset.fold; f.classList.toggle('open'); S.folds[k] = f.classList.contains('open'); guardarUI(); });
    app.querySelectorAll('[data-abrir]').forEach(b => b.onclick = () => { const o = b.parentElement, k = b.dataset.abrir; o.classList.toggle('open'); S.abiertos[k] = o.classList.contains('open'); b.setAttribute('aria-expanded', S.abiertos[k]); guardarUI(); });
    app.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { const s = b.closest('.panel'), k = b.dataset.per; s.classList.toggle('min'); S.folds[k] = s.classList.contains('min'); b.setAttribute('aria-expanded', !S.folds[k]); b.querySelector('.tlbl').innerHTML = b.querySelector('.tlbl').innerHTML.replace(/tocá para (ver los objetivos|minimizar)/, S.folds[k] ? 'tocá para ver los objetivos' : 'tocá para minimizar'); guardarUI(); });
    app.querySelectorAll('[data-todos]').forEach(b => b.onclick = () => { const abrir = b.dataset.todos === '1'; b.closest('.panel').querySelectorAll('.obj').forEach(o => { o.classList.toggle('open', abrir); S.abiertos[o.dataset.o] = abrir; }); guardarUI(); });
    const track = app.querySelector('#track');
    if (track && m) {
      const ir = (i, suave) => { track.scrollTo({ left: i * (track.clientWidth + 16), behavior: suave ? 'smooth' : 'auto' }); };
      const marcar = i => { S.per[m.slug] = i; guardarUI(); app.querySelectorAll('[data-pt]').forEach((b, j) => b.classList.toggle('on', j === i)); app.querySelectorAll('.dots i').forEach((d, j) => d.classList.toggle('on', j === i)); };
      requestAnimationFrame(() => ir(S.per[m.slug] || 0, false));
      app.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => { const i = Number(b.dataset.pt); marcar(i); ir(i, true); });
      let t; track.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(() => { const i = Math.round(track.scrollLeft / (track.clientWidth + 16)); if (i !== (S.per[m.slug] || 0)) marcar(i); }, 90); }, { passive: true });
    }
    app.querySelectorAll('[data-mes]').forEach(b => b.onclick = e => { e.stopPropagation(); cargarMes(b.dataset.oid, b.dataset.mes); });
    app.querySelectorAll('[data-g]').forEach(b => b.onclick = async () => {
      const id = b.dataset.g, v = app.querySelector('[data-v="' + CSS.escape(id) + '"]').value, n = app.querySelector('[data-n="' + CSS.escape(id) + '"]').value;
      if (!String(v).trim()) return toast('Poné el número');
      b.disabled = true; b.textContent = 'Guardando…';
      try { await enviar({ id: id, valor: v, nota: n }); toast('Guardado'); cargar(true); } catch (e) { toast('No se guardó: ' + e.message); b.disabled = false; b.textContent = 'Guardar'; }
    });
  }
  function cargarMes(oid, mes) {
    const o = [].concat.apply([], S.data.marcas.map(m => [].concat.apply([], m.periodos.map(p => p.objetivos)))).filter(x => x.id === oid)[0];
    const que = o.metrica === 'seg_netos' ? 'seguidores netos (sumados menos perdidos)' : o.metrica === 'contactos' ? 'contactos nuevos' : 'alcance (cuentas alcanzadas)';
    const d = document.createElement('div'); d.className = 'modal';
    d.innerHTML = '<div class="box"><h3>' + esc(corto(o.objetivo)) + ' · ' + mesL(mes) + '</h3><p>Cargá los ' + que + ' de ' + mesL(mes) + ' en Instagram (Meta Business Suite > Estadísticas > Resultados, del 1 al último día del mes). Si después se carga el reporte mensual, vale el del reporte.</p><input inputmode="decimal" id="mv" placeholder="Número"><div class="acc"><button class="btn g" data-x>Cancelar</button><button class="btn" data-ok>Guardar</button></div></div>';
    document.body.appendChild(d); const inp = d.querySelector('#mv'); setTimeout(() => inp.focus(), 50);
    const cerrar = () => d.remove();
    d.onclick = e => { if (e.target === d) cerrar(); };
    d.querySelector('[data-x]').onclick = cerrar;
    const ok = async () => { if (!inp.value.trim()) return toast('Poné el número'); const b = d.querySelector('[data-ok]'); b.disabled = true; b.textContent = 'Guardando…'; try { await enviar({ id: oid, mes: mes, valor: inp.value }); cerrar(); toast('Guardado'); cargar(true); } catch (e) { toast('No se guardó: ' + e.message); b.disabled = false; b.textContent = 'Guardar'; } };
    d.querySelector('[data-ok]').onclick = ok; inp.onkeydown = e => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') cerrar(); };
  }
  cargar();
})();
</script>
</body>
</html>
