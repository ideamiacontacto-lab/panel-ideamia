<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reporte semanal · Ideamia</title>
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="forms.js"></script>
<script src="periodico.js"></script>
<script src="analisis.js"></script>
<script src="importar.js"></script>
<script src="fx.js"></script>
<script src="../../ideamia-nav.js?v=5" defer></script>
</head>
<body>
<div class="wrap">
  <header class="site-head"><a class="logo" href="./">Idea<b>mia</b></a><span class="pill" id="who"></span><span class="progress" id="progress"></span></header>
  <section class="hero">
    <div class="puzzle" aria-hidden="true"><svg viewBox="0 0 300 260"><defs><path id="pz" d="M20 20 H42 C40 12 44 6 50 6 C56 6 60 12 58 20 H80 V42 C88 40 94 44 94 50 C94 56 88 60 80 58 V80 H58 C60 88 56 94 50 94 C44 94 40 88 42 80 H20 V58 C12 60 6 56 6 50 C6 44 12 40 20 42 Z"/></defs><g class="p p1" style="--r:-14deg"><g class="pin"><g transform="translate(150 20) scale(1.25)"><use href="#pz" fill="#8F8F8F" transform="translate(0 9)"/><use href="#pz" fill="#E9E9E9"/></g></g></g><g class="p p2" style="--r:18deg"><g class="pin"><g transform="translate(40 110) scale(1.05)"><use href="#pz" fill="#B3A900" transform="translate(0 9)"/><use href="#pz" fill="#FFF200"/></g></g></g><g class="p p3" style="--r:-6deg"><g class="pin"><g transform="translate(175 150) scale(.9)"><use href="#pz" fill="#262626" transform="translate(0 8)"/><use href="#pz" fill="#4A4A4A"/></g></g></g></svg></div>
    <div class="kicker">— Estudio creativo · Sistema de reportes</div>
    <h1 class="wordmark"><span class="thin ln"><span>Reportes</span></span><span class="heavy ln"><span>de <b>redes</b></span></span></h1>
    <p class="lead">Las marcas no se construyen de una sola vez. <strong>Se construyen pieza por pieza</strong>, y cada reporte es una.</p>
  </section>

  <div class="seg" id="nav" style="margin-bottom:18px"><label><input type="radio" name="nav" value="nuevo" checked><span>Nuevo reporte</span></label><label><input type="radio" name="nav" value="historial"><span>Reportes anteriores</span></label><label id="navImportar"><input type="radio" name="nav" value="importar"><span>Subir reporte viejo</span></label></div>

  <div id="login" class="hidden"></div>
  <div id="historial" class="hidden"></div>
  <div id="importar" class="hidden"></div>

  <div id="setup" class="card accent">
    <div style="margin-bottom:14px"><span class="lbl">Tipo de reporte</span><div class="seg" id="tipoSeg"></div></div>
    <div class="grid g3">
      <label class="f"><span class="l">Marca</span><select id="marca"></select></label>
      <label class="f hidden" id="durWrap"><span class="l">Alcance del reporte</span><select id="dur"><option value="3">Trimestral · 3 meses</option><option value="6">Semestral · 6 meses</option><option value="12">Anual · 12 meses</option></select></label>
      <label class="f"><span class="l" id="periodoLbl">Semana a reportar</span><select id="periodo"></select></label>
    </div>
    <div class="small muted" id="durInfo"></div>
    <div class="small muted" id="setupInfo"></div>
  </div>

  <div id="errbox" class="errbox hidden"></div>
  <div id="form"></div>
  <div id="doneView" class="hidden"></div>
  <div id="printArea" aria-hidden="true"></div>
</div>

<div class="stickybar" id="bar">
  <div class="in">
    <div class="meter" id="meter"><div class="ring" title="Obligatorios completos"><svg viewBox="0 0 36 36"><circle class="bgc" cx="18" cy="18" r="15.9155"/><circle class="fgc" id="ringFg" cx="18" cy="18" r="15.9155"/></svg><b id="ringPct">0%</b></div><div class="st" id="status">Borrador guardado en este dispositivo automáticamente</div></div>
    <button class="btn" id="send">Enviar reporte</button>
  </div>
</div>

<script>
(function(){
  const C = window.IDEAMIA_CONFIG, U = window.IDX, FORMS = window.FORMS;
  const $ = s => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  // quién sos: lo guardado acá o, si entraste por el Panel diario, la misma persona (sesión compartida; "project" siempre pide clave)
  let storedUser=null; try{ storedUser = localStorage.getItem("ideamia-user"); if(!storedUser){ const s=localStorage.getItem("ideamia:persona"); if(s && s!=="project") storedUser=s; } }catch(e){}
  const respParam = (params.get("resp")||storedUser||"").toLowerCase();
  let resp = null, isProject = false;

  // Última selección (tipo, marca, período): al actualizar la página se vuelve al mismo reporte y aparece su borrador.
  let ui={}; try{ ui=JSON.parse(localStorage.getItem("ideamia-ui")||"{}")||{}; }catch(e){ ui={}; }
  let tipo = params.get("tipo") || ui.tipo || "sm";
  let marca = params.get("marca") || ui.marca || null, periodo = params.get("periodo") || ui.periodo || null, vals = {}, reports = [], idx = {};
  let reportsLoaded=false, editMode=false, sending=false, uploading=0, draftFail=false;
  let importando = !!ui.importando; // revisando un reporte viejo subido desde archivo
  const TIPO_L = {sm:"Social Media · semanal", cm:"Community Manager · semanal", mensual:"Mensual", periodico:"Trimestral · Semestral · Anual"};
  let tiposDisponibles = ["sm","cm","mensual","periodico"];
  let dur = Number(params.get("dur") || (periodo&&periodo.includes("+") ? periodo.split("+")[1] : ui.dur) || 3);
  function saveUI(){ try{ localStorage.setItem("ideamia-ui", JSON.stringify({tipo, marca, periodo, dur, importando})); }catch(e){} }
  // No cerrar la pestaña en medio de un envío o de una subida
  window.addEventListener("beforeunload", e=>{ if(sending || uploading>0){ e.preventDefault(); e.returnValue=""; } });
  const P = window.PERIODICO;

  // ---------- setup ----------
  const urlResp = (params.get("resp")||"").toLowerCase();
  // Por URL solo se acepta un responsable real (?resp=orne). "project" únicamente con clave (queda guardado en el dispositivo).
  let currentUser = (urlResp && urlResp!=="project" && C.RESPONSABLES[urlResp]) ? urlResp : (storedUser||"");
  function initRoles(){
    isProject = currentUser==="project";
    resp = (!isProject && C.RESPONSABLES[currentUser]) ? currentUser : null;
    if(resp){ try{ localStorage.setItem("ideamia-user",resp); }catch(e){} }
    if(resp && U.isCM(resp)) tipo="cm";
    tiposDisponibles = (resp && U.isCM(resp)) ? ["cm"] : resp ? ["sm","mensual","periodico"] : ["sm","cm","mensual","periodico"];
    $("#navImportar")?.classList.toggle("hidden", !!(resp && U.isCM(resp))); // los reportes viejos son mensuales o periódicos: solo Social Media y Project
    if(!tiposDisponibles.includes(tipo)) tipo = tiposDisponibles[0];
    $("#who").innerHTML = (isProject ? "Project · Joaquín" : resp ? `${esc(C.RESPONSABLES[resp].nombre)} · ${esc(C.RESPONSABLES[resp].rol)}` : "Equipo Ideamia") + ((isProject||resp) ? ` <a href="#" id="logout" style="margin-left:8px;color:var(--muted);text-decoration:none" title="Cambiar de usuario">✕</a>` : "");
    document.body.classList.toggle("compact", isProject || !!resp); // portada chica para quien ya entró: el formulario queda a mano
    if($("#logout")) $("#logout").addEventListener("click",e=>{ e.preventDefault(); try{ localStorage.removeItem("ideamia-user"); }catch(x){} location.href = location.pathname; });
  }
  const identified = () => isProject || !!resp;
  function renderLogin(){
    const box=$("#login"); box.classList.remove("hidden");
    ["setup","form","bar","historial","errbox","doneView"].forEach(id=>$("#"+id).classList.add("hidden")); $("#nav").classList.add("hidden");
    const people = Object.entries(C.RESPONSABLES).map(([slug,r])=>`<button class="btn ghost" data-login="${slug}" style="justify-content:flex-start;text-transform:none;letter-spacing:0;font-size:17px"><b>${esc(r.nombre)}</b>&nbsp;<span class="muted">· ${esc(r.rol)}</span></button>`).join("");
    box.innerHTML = `<div class="card accent"><h2 style="margin-bottom:6px">¿Quién sos?</h2><div class="muted small" style="margin-bottom:14px">Elegí tu nombre para ver tus marcas. Queda guardado en este dispositivo.</div>
      <div style="display:grid;gap:8px;max-width:420px">${people}
        <details style="margin-top:6px"><summary class="muted small" style="cursor:pointer">Soy Project (Joaquín)</summary><div style="display:flex;gap:8px;margin-top:8px"><input type="password" id="projPw" placeholder="Clave" style="max-width:220px"><button class="btn sm" id="projGo">Entrar</button></div></details>
      </div></div>`;
    box.querySelectorAll("[data-login]").forEach(b=>b.addEventListener("click",()=>setUser(b.dataset.login)));
    $("#projGo").addEventListener("click",()=>{ if($("#projPw").value===C.PANEL_PASSWORD) setUser("project"); else { $("#projPw").classList.add("invalid"); toast("Clave incorrecta","bad"); } });
    $("#projPw").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#projGo").click(); });
  }
  function setUser(u){ currentUser=u; try{ localStorage.setItem("ideamia-user",u); if(u!=="project") localStorage.setItem("ideamia:persona",u); }catch(e){} $("#login").classList.add("hidden"); $("#nav").classList.remove("hidden"); initRoles(); marca=null; periodo=null; showView("nuevo"); }
  function marcasDisponibles(){
    if(isProject) return C.MARCAS;
    if(resp && U.isCM(resp)) return C.MARCAS.filter(m=>U.cmDe(m)===resp);
    if(resp) return C.MARCAS.filter(m=>m.sm===resp);
    return C.MARCAS;
  }
  function responsableDe(){
    const m = C.MARCAS.find(x=>x.slug===marca); if(!m) return "";
    if(tipo==="cm") return C.RESPONSABLES[U.cmDe(m)]?.nombre || "CM";
    return C.RESPONSABLES[m.sm]?.nombre||m.sm;
  }
  const existing = () => idx[`${tipo}|${marca}|${periodo}`];
  function renderSetup(){
    $("#tipoSeg").innerHTML = tiposDisponibles.map(t=>`<label><input type="radio" name="tipo" value="${t}" ${t===tipo?"checked":""}><span>${TIPO_L[t]}</span></label>`).join("");
    const ms = marcasDisponibles();
    if(!marca || !ms.find(m=>m.slug===marca)) marca = ms[0].slug;
    const isMes = tipo==="mensual", isPer = tipo==="periodico";
    $("#periodoLbl").textContent = isPer ? "Mes de inicio del período" : isMes ? "Mes a reportar" : "Semana a reportar";
    $("#durWrap").classList.toggle("hidden", !isPer);
    let opts;
    if(isPer){
      $("#dur").value = String(dur);
      const closed = P.closedPeriods(dur, new Date(), importando);
      const custom = periodo && periodo.includes("+") && !closed.find(c=>c.id===periodo) && periodo.split("+")[1]===String(dur) ? periodo : null;
      if(!periodo || !periodo.includes("+") || periodo.split("+")[1]!==String(dur)) periodo = closed.length ? closed[0].id : `${P.startMonths()[dur-1].id}+${dur}`;
      opts = closed.map(c=>({id:c.id,label:c.label}));
      if(!opts.length) opts.push({id:periodo,label:P.parsePeriod(periodo).label});
      if(custom) opts.push({id:custom,label:P.parsePeriod(custom).label+"  ·  otro período"});
      opts.push({id:"__otro__",label:"Otro período (elegir mes de inicio)…"});
      $("#periodoLbl").textContent = "Período a reportar";
      const pp = P.parsePeriod(periodo);
      $("#durInfo").textContent = `Período: ${pp.label} · ${pp.meses.filter(m=>idx[`mensual|${marca}|${m}`]).length} de ${pp.n} mensuales cargados${pp.meses.some(m=>idx[`mensual|${marca}|${m}`])?"":" · el mes a mes se completa a mano"}`;
    } else {
      opts = isMes ? U.recentMonths() : U.recentWeeks();
      // reporte viejo importado: el mes puede ser anterior al arranque del sistema
      if(importando && isMes && periodo && /^\d{4}-\d{2}$/.test(periodo) && !opts.find(o=>o.id===periodo)) opts.push(U.monthFromId(periodo));
      if(!periodo || !opts.find(o=>o.id===periodo)) periodo = opts[0].id;
    }
    const selVal = periodo;
    $("#marca").innerHTML = ms.map(m=>{ const done = !!idx[`${tipo}|${m.slug}|${periodo}`]; return `<option value="${m.slug}" ${m.slug===marca?"selected":""}>${m.nombre}${done?"  ✓ entregado":""}</option>`; }).join("");
    $("#periodo").innerHTML = opts.map((o,i)=>`<option value="${o.id}" ${o.id===selVal?"selected":""}>${(isMes||isPer)?o.label:U.weekLabelYear(o)}${(!isPer&&i===0)?(isMes?"  ·  mes pasado":"  ·  semana pasada"):""}</option>`).join("");
    $("#setupInfo").innerHTML = `Carga: ${esc(responsableDe())} · ${esc(FORMS[tipo].titulo)}${reportsLoaded?"":` · <span style="color:var(--warn)">leyendo la planilla…</span>`}${borradoresHTML()}`;
    $("#setupInfo").querySelectorAll("[data-draft]").forEach(a=>a.addEventListener("click",e=>{ e.preventDefault(); const [t,m,p]=a.dataset.draft.split("|"); tipo=t; marca=m; periodo=p; if(p.includes("+")) dur=Number(p.split("+")[1]); editMode=false; switchForm(); window.scrollTo({top:0,behavior:"smooth"}); }));
  }
  // Borradores guardados en este dispositivo que todavía no se enviaron (para no perder trabajo al cambiar de marca o actualizar)
  function borradoresHTML(){
    const ms = marcasDisponibles(), out=[];
    try{
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i); if(!k||!k.startsWith("ideamia-draft|")) continue;
        const [,t,m,p]=k.split("|"); if(!t||!m||!p) continue;
        if(t===tipo && m===marca && p===periodo) continue;
        if(!tiposDisponibles.includes(t) || !ms.some(x=>x.slug===m)) continue;
        let d={}; try{ d=JSON.parse(localStorage.getItem(k)||"{}")||{}; }catch(e){ continue; }
        const llenos = Object.keys(d).filter(x=>!x.startsWith("_") && !/^(mm_|okr_\d+_obj|meta_\d+_obj|est_)/.test(x) && d[x]!=="" && d[x]!=null).length;
        if(llenos<2) continue;
        if(reportsLoaded && idx[`${t}|${m}|${p}`] && !d._edit_de && !d._import){ try{ localStorage.removeItem(k); }catch(e){} i--; continue; } // ya se entregó: se limpia
        const mk=C.MARCAS.find(x=>x.slug===m); const per = t==="periodico" ? P.parsePeriod(p).label : t==="mensual" ? U.monthFromId(p).label : U.weekFromId(p).label;
        out.push(`<a href="#" data-draft="${esc(t)}|${esc(m)}|${esc(p)}" style="color:var(--accent)">${esc(mk?mk.nombre:m)} · ${esc(TIPO_L[t]||t)} · ${esc(per)}${d._edit_de?" (corrección)":""}</a>`);
      }
      // borradores que están en la nube pero no en este dispositivo (empezados en otra compu o celular)
      for(const x of nubeLst){
        const k=x.clave; if(localStorage.getItem(k)!=null) continue;
        const [,t,m,p]=k.split("|"); if(!t||!m||!p || (t===tipo && m===marca && p===periodo)) continue;
        if(!tiposDisponibles.includes(t) || !ms.some(y=>y.slug===m)) continue;
        if(reportsLoaded && idx[`${t}|${m}|${p}`] && x.actualizado < U.ts(idx[`${t}|${m}|${p}`].enviado_en)+60000) continue;
        const mk=C.MARCAS.find(y=>y.slug===m); let per=p; try{ per = t==="periodico" ? P.parsePeriod(p).label : t==="mensual" ? U.monthFromId(p).label : U.weekFromId(p).label; }catch(e){}
        out.push(`<a href="#" data-draft="${esc(t)}|${esc(m)}|${esc(p)}" style="color:var(--accent)">☁ ${esc(mk?mk.nombre:m)} · ${esc(TIPO_L[t]||t)} · ${esc(per)}</a>`);
      }
    }catch(e){}
    return out.length ? `<div style="margin-top:8px">📝 Borradores sin enviar: ${out.join(" · ")}</div>` : "";
  }
  $("#tipoSeg").addEventListener("change", e=>{ tipo = e.target.value; editMode=false; importando=false; switchForm(); });
  $("#marca").addEventListener("change", e=>{ marca = e.target.value; editMode=false; importando=false; switchForm(); });
  $("#periodo").addEventListener("change", e=>{
    if(tipo==="periodico" && e.target.value==="__otro__"){
      const months = P.startMonths(); const pick = prompt("Mes de inicio del período (formato AAAA-MM, ej. 2026-08):", months[dur-1].id);
      if(pick && /^\d{4}-\d{2}$/.test(pick)) periodo = `${pick}+${dur}`; 
    } else periodo = e.target.value;
    llevarImportado(); editMode=false; switchForm(); });
  $("#dur").addEventListener("change", e=>{ dur = Number(e.target.value); periodo = `${periodo.split("+")[0]}+${dur}`; llevarImportado(); editMode=false; switchForm(); });
  // si se corrige el período de un reporte importado, lo leído viaja al período nuevo
  let _keyPrevia=null;
  function llevarImportado(){ if(!importando || !vals._import || !_keyPrevia) return; const k=draftKey(); if(k===_keyPrevia) return; try{ localStorage.setItem(k, JSON.stringify(vals)); localStorage.removeItem(_keyPrevia); }catch(e){} }
  $("#nav").addEventListener("change", e=>{ showView(e.target.value); });
  const vistaActual = () => document.querySelector("input[name=nav]:checked")?.value || "nuevo";
  function showView(v){
    const hist = v==="historial", imp = v==="importar", otra = hist || imp;
    ["setup","form","errbox","doneView"].forEach(id=>{ if(otra) $("#"+id).classList.add("hidden"); });
    $("#bar").classList.toggle("hidden", otra);
    $("#historial").classList.toggle("hidden", !hist);
    $("#importar").classList.toggle("hidden", !imp);
    if(hist) renderHistorial(); else if(imp) renderImportar(); else switchForm();
  }

  // ---------- subir reporte viejo ----------
  // Mensuales, trimestrales, semestrales o anuales hechos antes del sistema: se lee el archivo, la IA lo pasa al formato
  // del sistema y se abre el formulario ya completo para revisar y guardar.
  function renderImportar(){
    const box=$("#importar"); const ms=marcasDisponibles();
    const hoy=new Date(); const mesPasado = U.lastCompleteMonth().id;
    box.innerHTML = `<div class="card accent">
      <div class="kicker">— Para que todo quede en un solo lugar</div>
      <h2 style="margin:8px 0 10px">Subir un reporte viejo</h2>
      <p class="muted" style="margin:0 0 18px;max-width:640px">Mensuales, trimestrales, semestrales o anuales hechos antes del sistema. Subí el Word, PowerPoint, PDF o capturas: la IA los pasa al formato del sistema, lo revisás y queda en el historial, con su PDF y su presentación.</p>
      <div class="grid g3">
        <label class="f"><span class="l">Marca</span><select id="impMarca">${ms.map(m=>`<option value="${m.slug}" ${m.slug===marca?"selected":""}>${esc(m.nombre)}</option>`).join("")}</select></label>
        <label class="f"><span class="l">Tipo</span><select id="impTipo"><option value="mensual">Mensual</option><option value="3" selected>Trimestral</option><option value="6">Semestral</option><option value="12">Anual</option></select></label>
        <label class="f"><span class="l" id="impMesLbl">Mes de inicio</span><input type="month" id="impMes" max="${mesPasado}"></label>
      </div>
      <div class="small" id="impPer" style="margin:-4px 0 14px"></div>
      <label class="f"><span class="l">Archivo del reporte</span><input type="file" id="impFile" accept=".docx,.pptx,.pdf,image/*" multiple style="padding:10px"></label>
      <div class="help">Word (.docx), PowerPoint (.pptx), PDF o hasta 8 capturas de las páginas. Si es un .doc o .ppt viejo, guardalo antes como .docx, .pptx o PDF.</div>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px"><button class="btn" id="impGo">Procesar reporte</button><span class="small" id="impSt" style="color:var(--warn)"></span></div>
    </div>`;
    const actualizar = () => {
      const t=$("#impTipo").value, m=$("#impMes").value; const mens = t==="mensual";
      $("#impMesLbl").textContent = mens ? "Mes del reporte" : "Mes de inicio del período";
      if(!m){ $("#impPer").textContent=""; return; }
      const per = mens ? m : `${m}+${t}`; const lab = mens ? U.monthFromId(m).label : P.parsePeriod(per).label;
      const fin = mens ? m : P.parsePeriod(per).fin; const futuro = fin >= `${hoy.getFullYear()}-${U.pad(hoy.getMonth()+1)}`;
      const ya = idx[`${mens?"mensual":"periodico"}|${$("#impMarca").value}|${per}`];
      $("#impPer").innerHTML = futuro ? `<span style="color:var(--bad)">Ese período todavía no terminó.</span>` : `Período: <b>${esc(lab)}</b>${ya?` · <span style="color:var(--warn)">ya hay un reporte de ese período: si guardás, queda como versión nueva</span>`:""}`;
    };
    const defMes = t => { const d=new Date(hoy.getFullYear(), hoy.getMonth()-(t==="mensual"?1:Number(t)), 1); return `${d.getFullYear()}-${U.pad(d.getMonth()+1)}`; };
    $("#impMes").value = defMes("3");
    $("#impTipo").addEventListener("change", ()=>{ $("#impMes").value = defMes($("#impTipo").value); actualizar(); });
    $("#impMes").addEventListener("change", actualizar); $("#impMarca").addEventListener("change", actualizar);
    actualizar();
    $("#impGo").addEventListener("click", procesarImportacion);
  }
  async function procesarImportacion(){
    const st = t => { $("#impSt").textContent = t; };
    const t=$("#impTipo").value, mes=$("#impMes").value, mk=$("#impMarca").value, files=$("#impFile").files;
    if(!mes){ st("Elegí el mes."); return; }
    if(!files || !files.length){ st("Elegí el archivo del reporte."); return; }
    const tipoD = t==="mensual" ? "mensual" : "periodico", per = t==="mensual" ? mes : `${mes}+${t}`;
    const finPer = t==="mensual" ? mes : P.parsePeriod(per).fin; const hoy=new Date();
    if(finPer >= `${hoy.getFullYear()}-${U.pad(hoy.getMonth()+1)}`){ st("Ese período todavía no terminó."); return; }
    const marcaNom = (C.MARCAS.find(x=>x.slug===mk)||{}).nombre || mk;
    const perLabel = t==="mensual" ? U.monthFromId(mes).label : P.parsePeriod(per).label;
    const btn=$("#impGo"); btn.disabled=true; uploading++;
    try{
      st("Leyendo el archivo…");
      const lect = await window.IMPORTAR.leerArchivos(files, `${marcaNom} · ${perLabel}`);
      let orig=null;
      if(lect.tipo==="texto" || /pdf$/i.test(files[0].name)){ st("Guardando el archivo original en Drive…"); orig = await window.IMPORTAR.subirOriginal(files[0], {marca:mk, periodo:per}); }
      const datos={}, devol=[], paginas=[];
      if(!C.UPLOAD_URL) devol.push("La lectura automática no está configurada: completá a mano lo principal.");
      else {
        const ctx = { marca:marcaNom, periodo:perLabel, tipoNombre: t==="mensual"?"mensual":P.parsePeriod(per).tipoNombre.toLowerCase(), archivo: files[0].name };
        // Word, PowerPoint o PDF con texto: se pide en 3 partes (números · listas · textos) con todo el texto del reporte.
        // Capturas o PDF escaneado: una pasada por página.
        const pasos = lect.tipo==="texto"
          ? window.IMPORTAR.GRUPOS[tipoD].map((g,i,arr)=>({ img: lect.imagenes[0], grupo:g, etiqueta:`parte ${i+1} de ${arr.length}`, texto: lect.texto }))
          : lect.imagenes.map((img,k,arr)=>({ img, grupo:"", etiqueta: arr.length>1?`página ${k+1} de ${arr.length}`:"", parte: arr.length>1?`${k+1} de ${arr.length}`:"", texto: (lect.textosPagina||[])[k]||"" }));

          try{
            const r = await U.subirFoto(p.img, {marca:mk, periodo:per, campo:"importar", tipo:tipoD, leer:true, timeout:200000,
              prompt: window.IMPORTAR.prompt(tipoD, ctx, p.texto||"", p.parte||"", p.grupo)});
            if(lect.tipo!=="texto" || k===0) paginas.push({id:r.id, url:r.url, nombre:r.nombre});
            if(r.iaFallo){ devol.push("La lectura con IA no está respondiendo ahora: el archivo quedó guardado y podés completar el reporte a mano (o volver a subirlo más tarde)."); break; }

      if(leidos) devol.unshift(`Completé ${leidos} campos con lo que dice el reporte.`);
      if(faltan.length) devol.push(`No estaban en el reporte: ${faltan.slice(0,8).join(", ")}${faltan.length>8?` y ${faltan.length-8} más`:""}. Podés completarlos o dejarlos vacíos.`);
      // se abre el formulario de ese tipo, marca y período, con lo que leyó la IA

      const v = Object.assign({}, datos, { _import:{ archivo: files.length>1 ? `${files.length} capturas` : files[0].name, url: orig?orig.url:"", ia: devol.join(" "), leidos, paginas, en: new Date().toISOString() } });

  // ---------- render ----------

          ${full?"":`<label class="foto add ${off?"off":""}" title="${off?"La subida de capturas todavía no está configurada":"Agregar captura"}"><input type="file" accept="image/*" ${f.max===1?"":"multiple"} data-fotos="${f.id}" data-max="${f.max||6}" ${off?"disabled":""}><span>＋<br><small>${off?"No disponible":f.cover?"Portada":"Captura"}</small></span></label>`}

  // Devoluciones de la IA de las capturas de un campo
  function iaHTML(arr){

  }
  // Chequeo en vivo del tracker de OKR: con qué dato se compara cada objetivo y si se cumple
  function okrPrevHTML(){
    if(tipo!=="periodico" || !periodo) return "";
    const n = P.parsePeriod(periodo).n; const rows=[];
    for(let i=1;i<=6;i++){
      const obj=vals[`okr_${i}_obj`]; if(!obj || !String(obj).trim()) continue;
      const rr=P.okrReal(obj, vals, n, vals[`okr_${i}_real`]); const isPct=/%/.test(obj)||!!rr.pct;
      const mn=U.num(vals[`okr_${i}_min`]), mx=U.num(vals[`okr_${i}_max`]); const st=P.okrEstado(rr.v,mn,mx);
      const fv = v => v==null ? "–" : isPct ? v.toFixed(2).replace(".",",")+" %" : U.fmt(Math.round(v));
      rows.push(`<tr><td>${esc(obj)}</td><td class="muted">${rr.fuente?esc(rr.fuente):'<span style="color:var(--warn)">No lo reconozco: cargá el valor en "Logrado"</span>'}</td><td><b>${fv(rr.v)}</b></td><td>${mn!=null||mx!=null?`${fv(mn)}${mx!=null?" – "+fv(mx):""}`:'<span class="muted">sin meta</span>'}</td><td style="color:${st==="ok"?"var(--ok)":st==="warn"?"var(--warn)":st==="bad"?"var(--bad)":"var(--muted)"}">${st==="ok"?"Cumplido":st==="warn"?"Cerca":st==="bad"?"No cumplido":"–"}</td></tr>`);
    }
    if(!rows.length) return `<div class="small muted">Cuando cargues los objetivos, acá vas a ver con qué dato se compara cada uno y si se cumple (así sale en la presentación).</div>`;
    return `<b>Así sale en la presentación</b><table class="t" style="margin-top:6px"><thead><tr><th>Objetivo</th><th>Se compara con</th><th>Logrado</th><th>Meta</th><th>Estado</th></tr></thead><tbody>${rows.join("")}</tbody></table>`;

  function renderTable(f){
    let h = `<div class="f" data-field="${f.id}"><span class="l">${esc(f.label)}</span><div style="overflow:auto"><table class="t"><thead><tr><th>#</th>${f.cols.map(c=>`<th>${esc(c.l)}</th>`).join("")}</tr></thead><tbody>`;

  // Lista de ítems (reemplaza a las tablas): una tarjeta por ítem con cada campo rotulado

  function renderReadOnly(schema, d){

    let rows = d.importado ? `<div class="ref" style="border-style:solid">📎 Reporte importado de <b>${esc(d.importado_archivo||"un archivo")}</b> (hecho antes del sistema)${d.importado_url?` · <a href="${esc(d.importado_url)}" target="_blank" rel="noopener">ver el original ↗</a>`:""}</div>` : "";

        if(f.type==="table"||f.type==="list"){ const trs=[]; for(let r=1;r<=f.rows;r++){ if(!f.cols.some(c=>d[`${f.id}_${r}_${c.id}`])) continue; trs.push(`<tr><td class="muted">${r}</td>${f.cols.map(c=>`<td>${cellRO(c, d[`${f.id}_${r}_${c.id}`])}</td>`).join("")}</tr>`); } if(trs.length) items.push(`<table class="t" style="margin:6px 0"><tr><th>#</th>${f.cols.map(c=>`<th>${esc(c.l)}</th>`).join("")}</tr>${trs.join("")}</table>`); return; }

        if(f.type==="logo"){ items.push(`<div style="margin:4px 0"><span class="muted">${esc(f.label)}:</span> <img src="${esc(v)}" style="height:32px;vertical-align:middle;background:#fff;border-radius:4px;padding:2px"></div>`); return; }

        if(f.type==="fotos"){ const arr=Array.isArray(raw)?raw:[]; if(!arr.length) return; items.push(`<div style="margin:6px 0"><div class="muted small">${esc(f.label)}</div><div class="fotos">${arr.map(p=>`<a class="foto" href="${esc(p.url)}" target="_blank" rel="noopener"><img src="${esc(p.url)}" loading="lazy" alt=""></a>`).join("")}</div>${iaHTML(arr)}</div>`); return; }
        if(f.type==="color"){ items.push(`<div style="margin:4px 0"><span class="muted">${esc(f.label)}:</span> <span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:${esc(v)};vertical-align:middle"></span> <b>${esc(v)}</b></div>`); return; }

  // Tabla comparativa en vivo: período anterior · este período · variación
  function prevReport(){
    if(tipo==="sm") return idx[`sm|${marca}|${U.prevWeekId(periodo)}`];
    if(tipo==="mensual") return idx[`mensual|${marca}|${U.prevMonthId(periodo)}`];
    if(tipo==="periodico") return idx[`periodico|${marca}|${P.prevPeriodId(periodo)}`];
    return null;
  }
  function compareHTML(sec){
    if(!sec.compare) return "";
    const p = prevReport(); const pd = p ? (p.datos||{}) : null;
    const isMes = tipo!=="sm";
    const prevLbl = p ? p.periodo_label : (tipo==="periodico"?"período anterior":isMes?"mes anterior":"semana anterior");
    const val = (m,d) => { if(!d) return null; if(m.calc) return m.calc(d); const x=d[m.id]; return (x==null||x==="")?null:Number(String(x).replace(/\./g,"").replace(",",".")); };
    const f = (m,v) => v==null||isNaN(v) ? "–" : (m.pct ? v.toFixed(2).replace(".",",")+" %" : U.fmt(v));
    const trs = sec.compare.map(m=>{
      const a=val(m,pd), b=val(m,vals);
      let delta="", cls="";
      if(a!=null && b!=null && !isNaN(a) && !isNaN(b)){
        if(m.pct){ const d=b-a; delta=`${d>0?"+":""}${d.toFixed(2).replace(".",",")} pp`; cls = d===0?"":(d>0)!==!!m.inverse?"up":"down"; }
        else if(a===0){ delta = b===0?"=":"nuevo"; }
        else { const pc=(b-a)/a*100; delta=U.fmtPct(pc); cls = pc===0?"":(pc>0)!==!!m.inverse?"up":"down"; }
      }
      return `<tr><td>${esc(m.k)}</td><td class="muted">${f(m,a)}</td><td><b>${f(m,b)}</b></td><td class="d ${cls}" style="color:${cls==="up"?"var(--ok)":cls==="down"?"var(--bad)":"var(--muted)"}">${delta}</td></tr>`;
    }).join("");
    const note = p ? `Comparado contra el reporte de <b>${esc(prevLbl)}</b>. Se actualiza mientras cargás.` : `Todavía no hay reporte ${tipo==="periodico"?"del período":isMes?"del mes":"de la semana"} anterior para esta marca. Esta comparativa se completa sola a partir del próximo reporte.`;
    return `<div class="ref" data-compare="1"><div style="margin-bottom:6px">${note}</div><table class="t"><thead><tr><th>Métrica</th><th>${esc(prevLbl)}</th><th>${tipo==="periodico"?"Este período":isMes?"Este mes":"Esta semana"}</th><th>Variación</th></tr></thead><tbody>${trs}</tbody></table></div>`;
  }
  function refreshCompare(){
    FORMS[tipo].secciones.forEach(sec=>{ if(!sec.compare) return; const el=document.querySelector(`section[data-sec="${sec.num}"] [data-compare]`); if(el) el.outerHTML = compareHTML(sec); });
  }

  function renderRef(sec){

      return `<div class="ref"><b>Mes a mes</b> (${ag.cargados} de ${ag.meses.length} mensuales cargados; esta tabla va a la presentación)<table class="t" style="margin-top:6px"><tr><th>Mes</th><th>Alcance</th><th>Visualiz.</th><th>Seg. netos</th><th>Interacc.</th><th>Contactos</th></tr>${trs}</table>${ag.alc_suma!=null?`<div class="small" style="margin-top:6px">Suma de alcances mensuales: <b>${U.fmt(ag.alc_suma)}</b>. El alcance del período son cuentas únicas: tomarlo de Meta, no de esta suma.</div>`:""}</div>`;
    }

      }
      if(p){ const d=p.datos||{};
        const li=(k,v)=>v?`<div style="margin:4px 0"><span class="muted">${k}:</span> ${esc(v)}</div>`:"";
        h += `<details class="ref"><summary style="cursor:pointer"><b>Lo que planteaste en ${esc(p.periodo_label)}</b> <span class="muted">· para revisar si se cumplió</span></summary>${li("Escalar",d.plan_escalar)}${li("Ajustar",d.plan_ajustar)}${li("Discontinuar",d.plan_discontinuar)}${li("Testear",d.plan_testear)}${li("Campañas previstas",d.camp_prox)}${li("Aprendizajes",[d.aprend1,d.aprend2,d.aprend3].filter(Boolean).join(" · "))}</details>`;
      }
      return h;
    }
    if(sec.ref==="contenido") return queFuncionoHTML();
    return "";
  }
  // Semanas que cubre el reporte actual (mensual: las del mes; periódico: las de todos sus meses)
  function semanasDelReporte(){
    if(tipo==="mensual") return U.weeksInMonth(periodo).map(w=>w.id);
    if(tipo==="periodico") return P.parsePeriod(periodo).meses.flatMap(m=>U.weeksInMonth(m).map(w=>w.id));
    return [];
  }
  function queFuncionoActual(){ return window.ANALISIS ? window.ANALISIS.queFunciono(reports, marca, semanasDelReporte()) : null; }
  // Tabla automática "Qué funcionó" con lo cargado en los semanales
  function queFuncionoHTML(){

    if(!q.n) return `<div class="ref">Cuando haya reportes semanales de este ${tipo==="mensual"?"mes":"período"}, acá aparece solo qué tipo de contenido, día y horario rindieron más.</div>`;

      ${falta?`<div class="help" style="margin-top:8px">${falta} pieza${falta>1?"s":""} sin tipo de contenido cargado (reportes anteriores al cambio): no entran en la primera tabla.</div>`:""}
      <div class="help" style="margin-top:6px">Usalo para el ranking, los aprendizajes y el plan: escalar lo que rinde, discontinuar lo que no.</div></div>`;
  }
  function renderForm(){

    $("#form").innerHTML = S.secciones.map(sec=>`<section class="section card" data-sec="${sec.num}">
      <div class="section-head"><span class="num">${String(sec.num).padStart(2,"0")}</span><h2>${esc(sec.titulo)}</h2>${sec.hint?`<span class="hint">${esc(sec.hint)}</span>`:""}</div>

    if(importando && vals._import){ const im=vals._import; const box=document.createElement("section"); box.className="section card"; box.style.borderTop="2px solid var(--accent)"; box.dataset.sec="0";
      box.innerHTML=`<div class="section-head"><span class="num" style="color:var(--accent);opacity:1;transform:none">↑</span><h2 style="opacity:1;transform:none">Reporte importado</h2><span class="hint"><button type="button" class="btn sm ghost" id="cancelImp">Descartar</button></span></div>
        <p style="margin:0 0 8px">Leído de <b>${esc(im.archivo||"archivo")}</b>${im.url?` · <a href="${esc(im.url)}" target="_blank" rel="noopener">ver el original ↗</a>`:""}. ${im.leidos?`La IA completó <b>${im.leidos} campos</b>.`:""} Revisá, corregí lo que haga falta y tocá <b>Guardar en el historial</b>. No hace falta completar todo: un reporte viejo no tiene por qué tener todos los datos.</p>
        ${im.ia?`<div class="diag" style="margin:8px 0 0"><div class="diag-head"><span>Lo que dice la IA</span></div><div class="small">${esc(im.ia)}</div></div>`:""}`;
      $("#form").prepend(box); box.querySelector("#cancelImp").addEventListener("click", cancelImport); }
    $("#send").textContent = importando ? "Guardar en el historial" : editMode ? "Enviar corrección" : "Enviar reporte";
    applyVisibility();
    refreshDiag();
    updateMissing();
  }
  // ---------- diagnóstico automático ----------
  function diagHTML(res, titulo){
    if(!res || !res.items || !res.items.length) return "";
    const col = l => l==="ok"?"var(--ok)":l==="warn"?"var(--warn)":l==="bad"?"var(--bad)":"var(--info)";
    const score = res.score!=null ? `<span class="pill ${res.score>=75?"ok":res.score>=45?"warn":"bad"}">${res.score>=75?"Bueno":res.score>=45?"Medio":"Flojo"}</span>` : "";
    return `<div class="diag-head"><span>${esc(titulo)}</span>${score}</div>${res.veredicto?`<div class="diag-v">${esc(res.veredicto)}</div>`:""}<ul class="diag-list">${res.items.map(x=>`<li><i style="background:${col(x.lvl)}"></i><b>${esc(x.k)}</b><span>${esc(x.txt)}</span></li>`).join("")}</ul>`;
  }
  function computeDiag(target, i){
    if(target==="reel"){ const base = window.ANALISIS.baselineReels(reports, marca, periodo); return window.ANALISIS.diagReel(vals, i, base); }
    if(target==="pub"){ const base = window.ANALISIS.baselinePubs(reports, marca, periodo); return window.ANALISIS.diagPub(vals, i, base); }
    if(target==="semana"){ const p = idx[`sm|${marca}|${U.prevWeekId(periodo)}`]?.datos || null; return { items: window.ANALISIS.diagSemana(vals, p) }; }
    return null;
  }
  function refreshDiag(){
    if(!window.ANALISIS) return;
    document.querySelectorAll("[data-diag]").forEach(el=>{
      const t=el.dataset.diag, i=Number(el.dataset.i||0);
      const res = computeDiag(t,i);
      const html = diagHTML(res, t==="reel"?"Diagnóstico automático del reel":t==="pub"?"Diagnóstico automático de la publicación":"Lectura automática de la semana");
      el.innerHTML = html; el.classList.toggle("hidden", !html);
    });
  }
  // ---------- contador de obligatorios ----------
  function missingList(){
    const errs=[]; let total = editMode ? 1 : 0;
    if(importando){ errs.total = 0; return errs; }
    if(editMode && !(vals.edicion_motivo||"").trim()) errs.push({id:"edicion_motivo", msg:"¿Qué corregís y por qué?"});
    window.walkFields(FORMS[tipo], vals, (f,ctx)=>{
      if(f.type==="table"||f.type==="list"||f.type==="fotos") return;
      if(f.showIf && !f.showIf(vals)) return; if(!isReq(f)) return; total++;
      const v = vals[f.id]; if(v==null||v===""||(Array.isArray(v)&&!v.length)||(f.type==="number"&&U.num(v)==null)||(f.type==="url"&&!/^https?:\/\/\S+$/i.test(String(v).trim()))) errs.push({id:f.id, msg:(ctx.repeat?`${ctx.repeat.title(ctx.i)} · `:"")+f.label});
    });

    return errs;
  }
  // Anillo de progreso: porcentaje de obligatorios completos; al 100 % el botón Enviar se ilumina

  }

  // ---------- bloqueos ----------
  // 1) SM sin reporte de CM → nada. 2) SM sin confirmar lectura del CM → solo hasta el bloque 2. 3) Reporte ya enviado → ver / editar.
  function applyGate(){
    ["cmGate","dupGate"].forEach(id=>document.getElementById(id)?.remove());
    const secs = Array.from($("#form").querySelectorAll("section"));
    secs.forEach(s=>s.classList.remove("hidden")); $("#bar").classList.toggle("hidden", vistaActual()!=="nuevo"); // la barra de enviar solo en "Nuevo reporte"

        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sm ghost" id="verEx">Ver el reporte</button><button class="btn sm" id="editEx">Editar y reenviar</button></div>

    if(reportsLoaded && m && m.cm && !idx[`cm|${marca}|${periodo}`]){
      secs.forEach(s=>s.classList.add("hidden")); $("#bar").classList.add("hidden");
      const per=U.weekFromId(periodo);

      box.innerHTML=`<h2 style="margin-bottom:8px">Falta el reporte del CM</h2>
        <p style="margin:0 0 12px">El reporte de Social Media de <b>${esc(m.nombre)}</b> para la semana <b>${esc(per.label)}</b> se completa después de leer el reporte del CM de esa misma semana, y el CM todavía no lo cargó. Pedile que lo suba y volvé a entrar; el borrador de lo que ya escribiste queda guardado.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sm" id="recheck">Volver a comprobar</button><span class="small muted" style="align-self:center">Podés cambiar de marca arriba si otra ya tiene el reporte del CM.</span></div>`;
      $("#form").prepend(box);

      return;
    }

    const gateField = FORMS.sm.secciones.flatMap(s=>s.fields).find(f=>f.gate);

      const sec2=$(`section[data-sec="${gateSec}"]`); sec2?.querySelectorAll("[data-field]").forEach(el=>{ if(el.dataset.field!==gateField.id) el.classList.add("hidden"); });

  // Empezar (o retomar) la corrección de un reporte ya enviado. Si en este dispositivo ya había una corrección a medio hacer, se retoma esa.
  function startEdit(ex){
    let d=null; try{ d=JSON.parse(localStorage.getItem(draftKey())||"null"); }catch(e){}

  function fieldDefs(){ const defs={}; window.walkFields(FORMS[tipo], vals, f=>{ if(f.id) defs[f.id]=f; }); return defs; }

  // ---------- state ----------
  const draftKey = () => `ideamia-draft|${tipo}|${marca}|${periodo}`;
  function saveDraft(){

    catch(e){ if(!draftFail && !U.nubeOn()) toast("Este navegador no está guardando el borrador (modo incógnito o memoria llena). No actualices la página hasta enviar.","bad"); draftFail=true; }

  // ---------- copia en la nube ----------
  // Unos segundos después de dejar de escribir, el borrador se copia a la pestaña "Borradores" de la planilla.
  let nubePend=null, nubeTimer=null, nubeEstado="", nubeLst=[];
  function programarNube(){

  // ---------- validación ----------
  const empty = v => v==null || v==="" || (Array.isArray(v)&&!v.length);
  function validate(){
    const errs=[]; document.querySelectorAll(".invalid").forEach(x=>x.classList.remove("invalid"));
    if(importando) return errs; // reporte viejo: se guarda con lo que tenga
    if(editMode && !(vals.edicion_motivo||"").trim()) errs.push({id:"edicion_motivo", msg:"¿Qué corregís y por qué?"});
    window.walkFields(FORMS[tipo], vals, (f,ctx)=>{
      if(f.type==="table"||f.type==="list"||f.type==="fotos") return;
      if(f.showIf && !f.showIf(vals)) return;
      if(!isReq(f)) return;
      const v = vals[f.id];
      if(empty(v) || (f.type==="number" && U.num(v)==null) || (f.type==="url" && !/^https?:\/\/\S+$/i.test(String(v).trim()))){
        const pre = ctx.repeat ? `${ctx.repeat.title(ctx.i)} · ` : "";

  function markInvalid(errs){

  // ---------- envío ----------
  function buildPayload(){
    const m = C.MARCAS.find(x=>x.slug===marca);
    const per = tipo==="periodico" ? P.parsePeriod(periodo) : tipo==="mensual" ? U.monthFromId(periodo) : U.weekFromId(periodo);
    const d = vals;
    const now = new Date();
    const off = -now.getTimezoneOffset(); const sg = off>=0?"+":"-"; const oh=U.pad(Math.floor(Math.abs(off)/60)), om=U.pad(Math.abs(off)%60);
    const enviado = `${U.iso(now)}T${U.pad(now.getHours())}:${U.pad(now.getMinutes())}:${U.pad(now.getSeconds())}${sg}${oh}:${om}`;
    let resumen="", alcance=null, netos=null, inter=null, reels=null;
    if(tipo==="sm"){ resumen=d.resumen||""; alcance=U.num(d.alcance_total); netos=U.num(d.seg_sumados)-U.num(d.seg_perdidos); inter=U.num(d.interacciones); reels=U.num(d.reels_n); }
    else if(tipo==="cm"){ resumen=`Mensajes: ${d.msg_total||0} · Tema: ${d.msg_tema||""}${d.cal_todo==="No, hubo faltantes"?" · HUBO FALTANTES":""}${d.inconv?" · Inconveniente: "+d.inconv:""}`; }
    else if(tipo==="periodico"){ resumen=`${per.tipoNombre}: ${d.s_texto||""}`; alcance=U.num(d.p_alc_total); netos=U.num(d.p_seg_sumados)-U.num(d.p_seg_perdidos); inter=U.num(d.p_inter); }
    else { resumen=d.resumen_mes||""; alcance=U.num(d.m_alc_total); netos=U.num(d.seg_sumados)-U.num(d.seg_perdidos); inter=U.num(d.m_inter); }
    if(editMode) resumen = "(corregido) " + resumen;
    if(importando) resumen = "(importado) " + resumen;
    const datos={}; Object.entries(d).forEach(([k,v])=>{ if(!empty(v) && !k.startsWith("_")) datos[k]=v; });
    if(tipo==="sm"){ for(let i=1;i<=Number(d.reels_n||0);i++) if(!datos[`reel${i}_alcanzado`]){ const a=calcAlcanzado(d,`reel${i}`); if(a) datos[`reel${i}_alcanzado`]=a; } for(let i=1;i<=Number(d.feed_n||0);i++) if(!datos[`pub${i}_alcanzado`]){ const a=calcAlcanzado(d,`pub${i}`); if(a) datos[`pub${i}_alcanzado`]=a; } }
    if(tipo==="sm" && window.ANALISIS){
      const base = window.ANALISIS.baselineReels(reports, marca, periodo);
      for(let i=1;i<=Number(d.reels_n||0);i++){ const r=window.ANALISIS.diagReel(d,i,base); if(r&&r.items&&r.items.length&&r.score!=null) datos[`reel${i}_diag`] = `${r.veredicto} ` + r.items.filter(x=>x.lvl!=="info").map(x=>`${x.k}: ${x.txt}`).join(" · "); }
      const p = idx[`sm|${marca}|${U.prevWeekId(periodo)}`]?.datos || null; const ds = window.ANALISIS.diagSemana(d,p); if(ds.length) datos.diag_semana = ds.map(x=>`${x.k}: ${x.txt}`).join(" · ");
      const bp = window.ANALISIS.baselinePubs(reports, marca, periodo);
      for(let i=1;i<=Number(d.feed_n||0);i++){ const r=window.ANALISIS.diagPub(d,i,bp); if(r&&r.items&&r.items.length&&r.score!=null) datos[`pub${i}_diag`] = `${r.veredicto} ` + r.items.filter(x=>x.lvl!=="info").map(x=>`${x.k}: ${x.txt}`).join(" · "); }
    }
    // reporte viejo subido desde archivo: queda marcado y con el enlace al original
    if(importando && d._import){ datos.importado = true; datos.importado_archivo = d._import.archivo||""; if(d._import.url) datos.importado_url = d._import.url; if(Array.isArray(d._import.paginas) && d._import.paginas.length) datos.importado_paginas = d._import.paginas.slice(0,8); }
    // "Qué funcionó" queda guardado en el mensual y el periódico para la presentación
    if((tipo==="mensual"||tipo==="periodico") && window.ANALISIS){ const q=queFuncionoActual(); if(q && q.n) datos.que_funciono = { n:q.n, pilar:q.pilar.slice(0,5), dia:q.dia.slice(0,3), franja:q.franja.slice(0,3), formato:q.formato.slice(0,4) }; }
    return { enviado_en:enviado, tipo, marca:m.nombre, marca_slug:marca, periodo_id:periodo, periodo_label:per.label, responsable:responsableDe(),
      resumen: resumen.slice(0,900), alcance: alcance??"", seguidores_netos: isNaN(netos)?"":netos??"", interacciones: inter??"", reels_publicados: reels??"", datos_json: JSON.stringify(datos) };
  }

  $("#send").addEventListener("click", async ()=>{

  // Diferencias entre versiones de un reporte (solo Project)
  function labelOf(tipo,id){ let found=null; const visit=f=>{ if(found) return; if(f.type==="row") f.fields.forEach(visit); else if(f.type==="repeat"){ for(let i=1;i<=9;i++) f.item(i).forEach(visit); } else if(f.id===id) found=f; }; (FORMS[tipo]||FORMS.sm).secciones.forEach(sc=>sc.fields.forEach(visit)); return found ? found.label : id; }
  function renderCambios(r){
    const chain=[...(r.versiones||[]), r]; let h="";
    for(let i=1;i<chain.length;i++){ const a=chain[i-1].datos||{}, b=chain[i].datos||{}; const keys=[...new Set([...Object.keys(a),...Object.keys(b)])].filter(k=>!k.startsWith("_")&&!/_diag$|^diag_|^edicion_motivo$|_fotos$/.test(k)&&JSON.stringify(a[k])!==JSON.stringify(b[k]));
      const sent=new Date(chain[i].enviado_en);
      h+=`<div class="diag" style="border-color:rgba(255,180,84,.5);background:rgba(255,180,84,.06)"><div class="diag-head" style="color:var(--warn)"><span>Corrección v${i+1} · ${isNaN(sent)?"":sent.toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} · ${esc(chain[i].responsable)}</span></div>

    return h;
  }

    box.querySelectorAll("[data-hp]").forEach(b=>b.addEventListener("click",()=>pdfReporte(list[b.dataset.hp])));

      const r=list[b.dataset.he];
      tipo=r.tipo; marca=r.marca_slug; periodo=r.periodo_id; if(periodo.includes("+")) dur=Number(periodo.split("+")[1]);
      editMode=false; const nv=document.querySelector('input[name=nav][value=nuevo]'); if(nv) nv.checked=true;
      showView("nuevo"); const ex=existing(); if(ex) startEdit(ex);
    }));
    box.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",async()=>{
      const r=list[b.dataset.del];
      if(!confirm(`¿Eliminar el reporte ${TL[r.tipo]||r.tipo} de ${r.marca} (${r.periodo_label})?\n\nDeja de verse en el historial, el panel y las comparativas. La fila queda en la planilla como respaldo.`)) return;
      b.disabled=true; b.textContent="Eliminando…";
      try{ await U.eliminarReporte(r, "Joaquín"); reports = reports.filter(x=>x!==r); idx=U.indexReports(reports); toast("Reporte eliminado","ok"); renderHistorial(); }
      catch(e){ b.disabled=false; b.textContent="Eliminar"; toast("No se pudo eliminar: "+e.message,"bad"); }
    }));
  }

  // ---------- init ----------
  initRoles(); if(identified()){ renderSetup(); loadDraft(); renderForm(); applyGate(); } else { renderLogin(); }
  function cargar(){
    return Promise.allSettled([U.loadCatalog(), U.loadReports()]).then(([cat, rep])=>{
      initRoles();
      if(rep.status==="fulfilled"){ reports=rep.value; idx=U.indexReports(reports); reportsLoaded=true; }
      if(U.nubeOn()) U.nubeLista().then(l=>{ nubeLst=l; if(identified() && !$("#setup").classList.contains("hidden")) renderSetup(); }).catch(()=>{});
      if(!identified()) renderLogin(); else showView(document.querySelector('input[name=nav]:checked')?.value || "nuevo");
      if(rep.status!=="fulfilled" && identified()){
        const box=$("#errbox"); box.classList.remove("hidden");
        box.innerHTML = `<b>No se pudo leer la planilla de reportes</b> (${esc(rep.reason&&rep.reason.message||"sin conexión")}). Podés seguir completando: el borrador se guarda igual. Sin la planilla no se ven los reportes ya entregados ni las comparativas. <div style="margin-top:8px"><button class="btn sm" id="reloadRep">Reintentar</button></div>`;
        $("#reloadRep").addEventListener("click",()=>{ $("#reloadRep").disabled=true; $("#reloadRep").textContent="Leyendo…"; cargar(); });
      }
    });
  }
  cargar();
})();
</script>
</body>
</html>
