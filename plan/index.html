<style>
/* celu: sin zoom automatico del iPhone al tocar un campo, y la pagina no se corre de costado (26/10/2026) */

@media (max-width:700px){.kpis{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;overflow:visible!important;margin-left:0!important;margin-right:0!important;padding-left:0!important;padding-right:0!important}.kpis .kpi{min-width:0!important;width:auto!important}.vseg{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.vseg>button{min-width:0;white-space:normal}.top{flex-wrap:wrap}.top .bts{flex-wrap:wrap;width:100%}.top .bts .btn{flex:1 1 auto;text-align:center}}

:root{--bg:#0A0A0A;--c1:#141414;--c2:#1C1C1C;--c3:#242424;--ln:#262626;--tx:#F5F5F5;--mu:#8C8C8C;--y:#FFF200;--ok:#5CE38A;--warn:#FFB454;--bad:#FF6B6B;--r:4px}
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.45 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--y)}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 70px}
.kick{color:var(--mu);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
h1{font:700 40px/1 'Barlow Condensed',sans-serif;letter-spacing:.02em;margin:4px 0 2px}h1 b{color:var(--y);font-weight:400}
.sub{color:var(--mu);margin:0 0 12px;font-size:14px}
.seg{display:inline-flex;gap:4px;background:var(--c1);border:1px solid var(--ln);border-radius:4px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:4px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--mu)}.seg button.on{background:var(--c3);color:var(--tx)}
.marcas{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px 6px}.marcas::-webkit-scrollbar{display:none}
.mc{scroll-snap-align:start;flex:none;display:flex;align-items:center;gap:9px;border:1px solid var(--ln);background:var(--c1);border-radius:4px;padding:8px 14px 8px 8px;transition:all .18s;text-align:left}
.mc.on{background:var(--y);color:#0A0A0A;border-color:var(--y)}.mc .n{font-weight:700;font-size:14px;white-space:nowrap}.mc .s{font-size:11.5px;opacity:.7;white-space:nowrap}
.ring{--p:0;width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),#2c2c2c 0);display:grid;place-items:center;flex:none}
.ring i{width:26px;height:26px;border-radius:50%;background:var(--c1);display:grid;place-items:center;font:700 10px Barlow;font-style:normal}
.mc.on .ring i{background:var(--y);color:#0A0A0A}.mc.on .ring{background:conic-gradient(#0A0A0A calc(var(--p)*1%),rgba(0,0,0,.18) 0)}
/* tarjetas de indicadores: carrusel en el celu, grilla en la compu */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
@media(max-width:760px){.kpis{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px 4px}.kpis::-webkit-scrollbar{display:none}.kpi{flex:0 0 42%;scroll-snap-align:start}}
.kpi{background:var(--c1);border:1px solid var(--ln);border-radius:4px;padding:12px;text-align:left;transition:border-color .2s}
.kpi:hover{border-color:#353535}.kpi .v{font:700 30px/1 'Barlow Condensed',sans-serif}.kpi .v.ok{color:var(--ok)}.kpi .v.mid{color:var(--warn)}.kpi .v.bad{color:var(--bad)}.kpi .v.nd{color:#555}
.kpi .l{font-size:12.5px;font-weight:600;margin-top:4px}.kpi .d{font-size:11px;color:var(--mu);margin-top:2px}
.kpi.pronto{opacity:.55;border-style:dashed}
.fold{background:var(--c1);border:1px solid var(--ln);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.fold>.fh{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:13px 16px;text-align:left}
.fh .t{flex:1;font-weight:600}.fh .cnt{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--c3)}
.fh .chev{transition:transform .25s;color:var(--mu)}.fold.open>.fh .chev{transform:rotate(180deg)}
.fb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}.fold.open>.fb{grid-template-rows:1fr}.fb>div{overflow:hidden}
.fold.roja{border-color:rgba(255,107,107,.35)}.fold.roja .cnt{background:rgba(255,107,107,.18);color:var(--bad)}
.rows{padding:0 16px 12px}

.row .m{color:var(--mu);font-size:12.5px}
.st{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.st.ok{background:rgba(92,227,138,.14);color:var(--ok)}.st.bad{background:rgba(255,107,107,.14);color:var(--bad)}.st.mid{background:rgba(255,180,84,.14);color:var(--warn)}.st.nd{background:var(--c2);color:var(--mu)}.st.prox{background:rgba(255,242,0,.12);color:var(--y)}
.al li{margin:6px 0;color:#e6e6e6;font-size:14px}.al ul{margin:0;padding:0 16px 12px 34px}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
.gate{max-width:380px;margin:40px auto;text-align:center}.gate input{width:100%;background:var(--c2);border:1px solid var(--ln);border-radius:4px;padding:12px;margin:12px 0}
.btn{background:var(--y);color:#0A0A0A;border:0;border-radius:4px;padding:9px 16px;font-weight:700}
.ps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid var(--ln);background:var(--c1);border-radius:999px;padding:8px 14px;font-weight:600}.chip.on{background:var(--y);color:#0A0A0A}
.pie{color:var(--mu);font-size:12px;margin-top:14px}
.ocup{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:8px;background:var(--y);color:#0A0A0A;border-radius:999px;padding:7px 14px 7px 10px;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.ocup i,.btn.cargando::after{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:gira .7s linear infinite;display:inline-block}
.btn.cargando,.seg2 button.cargando{opacity:.7;pointer-events:none}.btn.cargando::after{content:'';margin-left:8px;vertical-align:-1px}
@keyframes gira{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--c3);border:1px solid var(--ln);border-radius:4px;padding:10px 16px;font-size:14px;z-index:30}
/* ficha operativa */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.ayuda{font-size:13px;padding:8px 12px;flex:none}
.tarea>div:first-child{display:flex;gap:10px;align-items:flex-start}.pdot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px}.pdot.p0{background:var(--bad)}.pdot.p1{background:var(--warn)}.pdot.p2{background:var(--y)}.pdot.p3{background:#666}
.guia .s{color:var(--mu);font-size:14px}.gsec{background:var(--c2);border-radius:4px;padding:10px 12px;margin:8px 0}.gsec p{margin:4px 0 0;font-size:13.5px;color:#d6d6d6;line-height:1.45}
.pq{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln);font-size:14px}.pq .seg2{flex:none;margin:0}
.lt{display:block;font-size:11.5px;color:var(--mu);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 6px}
textarea{width:100%;background:var(--c2);border:1px solid var(--ln);border-radius:4px;padding:10px 12px;color:var(--tx);font:inherit;resize:vertical}
@media(max-width:600px){.row:has(.bts),.row:has([data-movi]),.row:has([data-reco]),.row:has([data-sug]){grid-template-columns:1fr}.row .bts{justify-content:flex-start}.pie-f{padding-right:72px}.vseg button{font-size:11.5px;padding:7px 3px;white-space:nowrap}.vseg .bdg{font-size:10px;padding:0 5px;margin-left:3px}.pq{flex-direction:column;align-items:flex-start}}
.crow .bts{flex-wrap:wrap;justify-content:flex-end}@media(max-width:600px){.crow{grid-template-columns:1fr}.crow .bts{justify-content:flex-start}}
.vseg{display:flex;width:100%}.vseg button{flex:1}.bdg{font-style:normal;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;margin-left:4px}
.fold.amar{border-color:rgba(255,242,0,.3)}.fold.amar .cnt{background:var(--y);color:#0A0A0A}
.fhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 12px}.fhead .nota{color:#ffd0d0;font-size:13.5px}
.aprob{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,242,0,.08);border:1px solid rgba(255,242,0,.35);border-radius:4px;padding:12px 14px;margin-bottom:10px}.aprob div{display:flex;gap:8px}
.pbar{height:6px;background:var(--c2);border-radius:4px;margin:6px 0 4px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--warn);border-radius:4px}.pbar i.ok{background:var(--ok)}
.bts{display:flex;gap:6px}.btn.g{background:var(--c3);color:var(--tx)}.btn:disabled{opacity:.45;cursor:default}.btn.add{margin-top:10px;background:none;border:1px dashed #3a3a3a;color:var(--y);width:100%}
.pill{font-size:11px;border-radius:999px;padding:2px 8px;background:var(--c3);color:var(--mu);font-weight:600}
.pie-f{position:sticky;bottom:10px;display:flex;gap:8px;justify-content:flex-end;align-items:center;background:rgba(10,10,10,.92);border:1px solid var(--ln);border-radius:4px;padding:10px;margin-top:12px;backdrop-filter:blur(6px)}.pie-f .m{color:var(--warn);font-size:12.5px;margin-right:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:end center;z-index:40}@media(min-width:700px){.modal{place-items:center}}
.modal .box{background:var(--c1);border:1px solid var(--ln);border-radius:6px 6px 0 0;padding:18px;width:100%;max-width:560px;max-height:90vh;overflow:auto}@media(min-width:700px){.modal .box{border-radius:4px}}
.modal h3{margin:0 0 6px}.modal label{display:block;font-size:11.5px;color:var(--mu);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 6px}.modal label.ck{text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--tx);display:flex;gap:8px;align-items:center}
.modal input:not([type=checkbox]){width:100%;background:var(--c2);border:1px solid var(--ln);border-radius:4px;padding:10px 12px;margin-bottom:6px}
.modal .acc{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.rowf{display:flex;gap:8px;align-items:center}.rowf input{flex:1}
.seg2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}.seg2 button{border:1px solid var(--ln);background:var(--c2);color:#cfcfcf;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}.seg2 button.on{background:var(--y);color:#0A0A0A;border-color:var(--y)}
.selpb{background:var(--c2);border:1px solid var(--ln);border-radius:4px;padding:8px 10px;color:var(--tx);font:inherit;max-width:220px}
.vseg .ct{display:none}@media(max-width:600px){.vseg .lg{display:none}.vseg .ct{display:inline}}
/* plan del mes: asistente por pasos */
.modal .box.wiz{max-width:640px;padding:0;display:flex;flex-direction:column}
.wtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px 6px}.wtop h3{margin:2px 0 0;font-size:18px}.wtop .m{color:var(--mu);font-weight:400;font-size:14px}
.x{flex:none;background:var(--c3);border:0;border-radius:50%;width:30px;height:30px;color:var(--mu);font-size:13px}
.steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 18px 10px;border-bottom:1px solid var(--ln)}.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--mu);font-size:12.5px;font-weight:600;padding:4px 8px 4px 4px;border-radius:999px}
.steps i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--c3);font-size:11.5px}
.steps button.on{color:var(--tx);background:var(--c2)}.steps button.on i{background:var(--y);color:#0A0A0A}.steps button.ok i{background:rgba(92,227,138,.18);color:var(--ok)}
.wbody{padding:12px 18px 6px;overflow:auto;overflow-x:hidden}.wbody .rowf input{min-width:0;width:auto;flex:1}.wbody .s{color:var(--mu);font-size:13.5px;margin:0 0 10px}.wbody .m{color:var(--mu);font-size:12.5px}
.wrow{position:relative;background:var(--c2);border:1px solid var(--ln);border-radius:4px;padding:10px 42px 8px 10px;margin-bottom:8px}.wrow .x{position:absolute;top:8px;right:8px;width:26px;height:26px}
.wrow input:not([type=date]){width:100%;background:var(--c1);border:1px solid var(--ln);border-radius:4px;padding:9px 11px;margin-bottom:6px}.wrow textarea{background:var(--c1)}.wrow .seg2{margin:2px 0 6px}
.wrow input[type=date]{background:var(--c1);border:1px solid var(--ln);border-radius:4px;padding:7px 9px;color-scheme:dark;width:auto;margin:0}
.wpie{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--ln);background:var(--c1)}.wpie .m{margin-right:auto;font-size:12.5px;color:var(--mu)}
@media(max-width:600px){.wpie{flex-wrap:wrap}.wpie .m{width:100%}}
@media(max-width:600px){h1{font-size:34px}}
/* paso de la estructura (1 anual · 2 mes · 3 entregas · 4 reels) */
.paso{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--c1);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.paso>i{font:400 26px/34px 'Barlow Condensed',sans-serif;font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--y);color:#0A0A0A;text-align:center}
.paso>div>b{display:block;font-size:15px}.paso>i.s{background:var(--c3);font:400 16px/34px Barlow}.paso p{margin:3px 0 0;color:#cfcfcf;font-size:13.5px;line-height:1.45}
.vseg .n{font-style:normal;opacity:.55;margin-right:4px}
/* entregas: cuenta regresiva */
.heros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.heros.u1{grid-template-columns:1fr}.heros.u2{grid-template-columns:1fr 1fr}
@media(max-width:700px){.heros{grid-template-columns:1fr}}
.hero{background:var(--c1);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.hero.main{border-color:rgba(255,242,0,.35)}
.hero .kick{font-size:10.5px}.hero .big{font:700 44px/1 'Barlow Condensed',sans-serif;margin:6px 0 2px}.hero .big small{font-size:18px;color:var(--mu);margin-left:6px}
.hero .big.y{color:var(--y)}.hero .big.bad{color:var(--bad)}.hero .big.ok{color:var(--ok)}
.hero .t{font-weight:600;font-size:14px;margin-bottom:8px}.hero .m{color:var(--mu);font-size:12.5px}.hero .pbar{margin-top:auto}
/* checklist del mes */
.ck3{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.ck3:first-child{border-top:0}
.ck3 .m{color:var(--mu);font-size:12.5px}.ck3 .seg2{margin:0;flex-wrap:nowrap}
@media(max-width:600px){.ck3{grid-template-columns:1fr}}
/* reels */
.mesr{background:var(--c1);border:1px solid var(--ln);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.mesr .hd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:14px 16px 10px}
.mesr .hd .num{font:700 34px/1 'Barlow Condensed',sans-serif}.mesr .hd .num small{font:600 13px Barlow;color:var(--mu);margin-left:6px}
.mesr .q .seg2{flex-wrap:nowrap;flex:none}.mesr .q{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--ln);background:var(--c2)}
@media(max-width:600px){.mesr .q{flex-direction:column;align-items:flex-start}}
.rr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--ln);padding:11px 16px;text-align:left}
.rr:hover{background:rgba(255,255,255,.02)}.rr .n{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rr .m{color:var(--mu);font-size:12.5px;margin-top:2px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.ch{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--c3);color:var(--mu)}
.ch.bad{background:rgba(255,107,107,.14);color:var(--bad)}.ch.mid{background:rgba(255,180,84,.14);color:var(--warn)}.ch.ok{background:rgba(92,227,138,.14);color:var(--ok)}
.rr .seg2{margin:0;flex-wrap:nowrap}
.lista-ok{margin:6px 0 0}.lista-ok .li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--ln);font-size:14px}.lista-ok .li:first-child{border-top:0}
.lista-ok .li i{font-style:normal;font-weight:700;text-align:center}.lista-ok .li i.ok{color:var(--ok)}.lista-ok .li i.bad{color:var(--bad)}.lista-ok .li i.mid{color:var(--warn)}
.lista-ok .li .m{color:var(--mu);font-size:12.5px}

/* v2 · 22/10/2026: el mismo lenguaje que el panel (referencias de Joaquín + Barlow): condensada en mayúscula para títulos y números,
   semi condensada para etiquetas, esquinas chicas, pestañas con barra amarilla y movimiento corto con curva expo */
:root{--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.16);--ease:cubic-bezier(.16,1,.3,1)}
html,body{font-family:Barlow,system-ui,sans-serif}
h1{font-weight:700;text-transform:uppercase;letter-spacing:-.01em}
.kick{font-family:'Barlow Semi Condensed',Barlow,sans-serif;letter-spacing:.16em;color:var(--y)}
.st,.ch,.pill,.fh .cnt,.bdg{border-radius:3px;font-family:'Barlow Semi Condensed',Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.fh .t{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.01em}
.btn{font-family:'Barlow Semi Condensed',Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase;font-size:13px;transition:transform .15s var(--ease),filter .15s var(--ease)}
.btn:active{transform:scale(.97)}.btn:not(.g):hover{filter:brightness(1.06)}
.btn.add{text-transform:none;letter-spacing:0;font-family:Barlow,sans-serif}
.mc{border-radius:4px}
/* pestañas: texto en mayúscula y barra amarilla que crece */
.seg.vseg{background:none;border:0;border-bottom:1px solid var(--ln);border-radius:0;padding:0;gap:0}
.vseg button{position:relative;border-radius:0!important;background:none!important;padding:12px 6px 13px;font-family:'Barlow Semi Condensed',Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;font-size:12.5px;color:var(--mu);transition:color .2s var(--ease)}
.vseg button.on{color:var(--tx)}
.vseg button:after{content:"";position:absolute;left:12%;right:12%;bottom:-1px;height:2px;background:var(--y);transform:scaleX(0);transform-origin:left;transition:transform .38s var(--ease)}
.vseg button.on:after{transform:scaleX(1)}
.vseg .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;opacity:.5}
.paso>i{border-radius:4px}
.paso>i svg,.ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}

if (window.self === window.top && !/[?&](embed|solo|demo)=1/.test(location.search)) { const q = new URLSearchParams(location.search), r = new URLSearchParams({ tab: 'plan' }); ['p', 'marca', 'vista'].forEach(k => { if (q.get(k)) r.set(k, q.get(k)); }); location.replace('../?' + r.toString()); }

<body>
<div class="wrap" id="app"><div class="empty">Cargando…</div></div>
<script>
(function () {
  const C = window.PANEL_CONFIG || {}, app = document.getElementById('app');
  const VER = '22';
  try { fetch(location.pathname + '?nocache=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => { const m = /const VER = '(\d+)'/.exec(t); if (m && m[1] !== VER && sessionStorage.getItem('plan:recargo') !== m[1]) { sessionStorage.setItem('plan:recargo', m[1]); location.replace(location.pathname + '?' + (s => { s.set('v', m[1]); return s.toString(); })(new URLSearchParams(location.search))); } }).catch(() => {}); } catch (e) {}
  const lsGet = k => { try { const v = localStorage.getItem(k); return v == null ? '' : v; } catch (e) { return ''; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const jget = k => { const v = lsGet(k); try { return v ? JSON.parse(v) : ''; } catch (e) { return v; } };
  // las pestañas siguen el orden de trabajo de Joaquín: 1 anual → 2 mes → 3 entregas → 4 reels (+ Ads y Cumplimiento)
  const VISTAS = ['anual', 'mes', 'entregas', 'reels', 'ads', 'cumple'], ALIAS = { camp: 'anual', ficha: 'mes', planb: 'reels' };
  const vistaOk = v => { v = ALIAS[v] || v; return VISTAS.indexOf(v) >= 0 ? v : ''; };
  const QS = new URLSearchParams(location.search);
  const S = { persona: QS.get('p') || jget('pi:persona') || lsGet('ideamia:persona') || '', key: jget('pi:key') || lsGet('ideamia:clave') || '', pkey: jget('pi:pkey') || '', data: null, marca: QS.get('marca') || lsGet('plan:marca'), mes: 'actual', folds: jget('plan:folds') || {}, vista: vistaOk(QS.get('vista')) || vistaOk(lsGet('plan:vista')) || 'anual', ficha: null, draft: {}, rvNo: {} };
  const PERMITIDAS = { orne: 'Orne', rama: 'Rama', project: 'Joaquín', joaco: 'Joaquín (prueba)' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // íconos de línea (v2: reemplazan a los emojis)
  const IC = {
    ads: '<svg viewBox="0 0 24 24"><path d="M4 10v4h3l6 4V6L7 10z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></svg>',
    brujula: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M15 9l-2 5-4 1 2-5z"/></svg>',
    cal: '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="1.5"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4"/></svg>',
    salvavidas: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/><path d="M6 6l3.5 3.5M18 6l-3.5 3.5M6 18l3.5-3.5M18 18l-3.5-3.5"/></svg>',
    grafico: '<svg viewBox="0 0 24 24"><path d="M4 20h16M7 16v-5M12 16V7M17 16v-8"/></svg>',
    campana: '<svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  };
  const ic = k => '<span class="ic">' + IC[k] + '</span>';
  const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'], DIA = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  const dm = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '–', diaDe = s => DIA[new Date(s + 'T12:00:00').getDay()];
  const CHEV = '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';
  const clave = () => S.persona === 'project' ? (S.pkey || S.key) : S.key;
  const toast = t => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3000); };
  const mesPedido = () => { const d = new Date(); if (S.mes === 'anterior') d.setMonth(d.getMonth() - 1, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };

  function gate(msg) {
    app.innerHTML = '<div class="gate"><div class="kick">Ideamia</div><h1><b>Plan</b></h1>' + (msg ? '<p class="sub">' + esc(msg) + '</p>' : '') +
      (S.persona && PERMITIDAS[S.persona] ? '' : '<p class="sub">¿Quién sos?</p><div class="ps">' + Object.keys(PERMITIDAS).map(p => '<button class="chip' + (S.persona === p ? ' on' : '') + '" data-p="' + p + '">' + PERMITIDAS[p] + '</button>').join('') + '</div>') +
      '<input id="k" type="password" placeholder="' + (S.persona === 'project' ? 'Clave del project' : 'Clave del equipo') + '"><button class="btn" id="ent">Entrar</button></div>';
    app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { S.persona = b.dataset.p; gate(msg); });
    const ent = () => { const v = app.querySelector('#k').value.trim(); if (!v || !S.persona) return toast('Elegí quién sos y poné la clave'); if (S.persona === 'project') S.pkey = v; else { S.key = v; lsSet('ideamia:clave', v); } lsSet('ideamia:persona', S.persona); cargar(); };
    app.querySelector('#ent').onclick = ent; app.querySelector('#k').onkeydown = e => { if (e.key === 'Enter') ent(); };
  }
  async function cargar() {
    // modo de prueba local (?demo=1): datos de ejemplo de demo.json, no habla con el servidor
    if (/[?&]demo=1/.test(location.search)) { const d = await fetch('demo.json', { cache: 'no-store' }).then(r => r.json()); S.data = d.plan; S.ficha = d.ficha; S.camp = d.camp; S.pauta = d.pauta; S.pb = d.pb; S.draft = {}; return pintar(); }
    if (!S.persona || !PERMITIDAS[S.persona]) return gate(S.persona ? 'Esta sección es solo para las social media y el project.' : '');
    if (!clave()) return gate('');
    // abre al instante con lo último que se vio (guardado en este navegador) y lo actualiza por detrás: el servidor tarda de 5 a 20 s
    const kc = 'plan:cache:' + S.persona, actual = S.mes === 'actual', vieja = actual ? jget(kc) : null;
    if (vieja && vieja.data) { Object.assign(S, { data: vieja.data, ficha: vieja.ficha, camp: vieja.camp, pauta: vieja.pauta, pb: vieja.pb }); pintar(); ocupado(1, 'Actualizando…'); }
    else app.innerHTML = '<div class="empty">Cargando…</div>';
    try {
      const q = x => fetch(C.API_URL + '?' + new URLSearchParams(Object.assign({ action: 'plan', k: clave(), p: S.persona }, x)), { cache: 'no-store' }).then(r => r.json());
      S.cargando = true;
      const [r, f, c, pa, pb] = await Promise.all([q({ mes: mesPedido() }), q({ que: 'ficha' }), q({ que: 'campanas' }), q({ que: 'pauta' }), q({ que: 'planb' }).catch(() => null)]).finally(() => { S.cargando = false; });
      if (r.error) return gate(r.mensaje || r.error);
      S.data = r; S.ficha = f && f.ok ? f : null; S.camp = c && c.ok ? c : null; S.pauta = pa && pa.ok ? pa : null; S.pb = pb && pb.ok ? pb : null;
      if (!S.marca || !sucio(S.marca)) S.draft = {};   // no se pierde lo que está escribiendo en la ficha
      if (actual) lsSet(kc, JSON.stringify({ t: Date.now(), data: S.data, ficha: S.ficha, camp: S.camp, pauta: S.pauta, pb: S.pb }));
      if (!document.querySelector('.modal')) pintar(); else S.repintar = true;   // con un formulario abierto se redibuja al cerrarlo
    } catch (e) { if (!vieja) app.innerHTML = '<div class="empty">No se pudo cargar: ' + esc(e.message) + '.</div>'; else toast('No se pudo actualizar: ' + e.message); }
    finally { if (vieja && vieja.data) ocupado(-1); }
  }
  /* Señal de "estoy trabajando": cada pedido al servidor muestra un cartel arriba y deja el botón tocado en espera, así nadie cree que no anda */
  let nOcup = 0, ultBtn = null;
  document.addEventListener('click', e => { const b = e.target.closest('button, .btn'); if (b) ultBtn = b; }, true);
  function ocupado(d, txt) {
    nOcup = Math.max(0, nOcup + d);
    let p = document.getElementById('ocup');
    if (nOcup && !p) { p = document.createElement('div'); p.id = 'ocup'; p.className = 'ocup'; document.body.appendChild(p); }
    if (p) { if (nOcup) p.innerHTML = '<i></i>' + esc(txt || p.dataset.t || 'Guardando…'); else p.remove(); if (txt) p && (p.dataset.t = txt); }
    if (!nOcup && S.repintar && !document.querySelector('.modal')) { S.repintar = false; pintar(); }
  }
  const fetch0 = window.fetch.bind(window);
  window.fetch = (u, o) => {
    if (!(o && o.method === 'POST')) {
      // las relecturas después de guardar (no la carga inicial) también avisan
      if (String(u).indexOf(C.API_URL) === 0 && S.data && !S.cargando) { ocupado(1, 'Actualizando…'); return fetch0(u, o).finally(() => ocupado(-1)); }
      return fetch0(u, o);
    }
    const b = ultBtn && document.contains(ultBtn) ? ultBtn : null; if (b) b.classList.add('cargando');
    ocupado(1, 'Guardando…');
    return fetch0(u, o).finally(() => { ocupado(-1); if (b) b.classList.remove('cargando'); });
  };
  new MutationObserver(() => { if (S.repintar && !nOcup && !document.querySelector('.modal')) { S.repintar = false; pintar(); } }).observe(document.body, { childList: true });
  async function recargarFicha() {
    const f = await fetch(C.API_URL + '?' + new URLSearchParams({ action: 'plan', k: clave(), p: S.persona, que: 'ficha' }), { cache: 'no-store' }).then(r => r.json());
    if (f && f.ok) { S.ficha = f; S.draft = {}; pintar(); }
  }
  async function enviarFicha(body) {
    const r = await fetch(C.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: 'ficha', k: clave(), persona: S.persona, marca: S.marca }, body)) }).then(r => r.json());
    if (r.error) throw new Error(r.mensaje || r.error); return r;
  }
  /* ---------- Ads: control semanal de la pauta ---------- */
  const pautaDe = slug => S.pauta && S.pauta.marcas.find(x => x.slug === slug);
  const PA = {};   // respuestas en edición por marca
  function pintarPauta(m) {
    const A = pautaDe(m.slug);
    if (!S.pauta) return '<div class="empty">No se pudo leer la pauta.</div>';
    if (!A) return '<div class="fold"><div class="empty">' + esc(m.nombre) + ' no tiene pauta publicitaria.</div></div>';
    const r = PA[m.slug] = PA[m.slug] || { texto: A.esta && A.esta.corriendo || '', edit: !(A.esta && A.esta.corriendo), resp: '', jtxt: '' };
    const RJ = { bien: ['ok', 'Funciona bien'], nuevo: ['mid', 'Hace falta contenido nuevo'], iterar: ['mid', 'Hay que iterar algo'] };
    let h = paso(IC.ads, 'Ads', 'Cada semana anotás <b>qué se está corriendo</b>. Si anda bien o hay que cambiar la pieza, el presupuesto o la segmentación lo sabe Juan: <b>cada 15 días le preguntás cómo viene</b> y si hace falta otro contenido o iterar algo.');
    // 1) esta semana: qué se está corriendo
    h += '<div class="fold open"><div class="rows" style="padding-top:14px"><div class="kick">Esta semana · desde el ' + dm(S.pauta.semana) + '</div>' +
      (r.edit ? '<label class="lt">¿Qué se está corriendo en ads?</label><textarea id="paTxt" rows="3" placeholder="Ej.: el reel de la promo del miércoles, campaña de mensajes a WhatsApp">' + esc(r.texto) + '</textarea>' +
        '<div class="bts" style="justify-content:flex-end;margin-top:10px">' + (A.esta && A.esta.corriendo ? '<button class="btn g" data-pcancel>Cancelar</button>' : '') + '<button class="btn" data-pg>Guardar</button></div>'
        : '<div class="row" style="border:0;padding:8px 0 2px"><div><b>' + esc(A.esta.corriendo) + '</b><div class="m">Anotado el ' + dm(A.esta.t.slice(0, 10)) + '</div></div><button class="btn g" data-pedit>Editar</button></div>') + '</div></div>';
    // 2) cada 15 días: qué dice Juan
    const ult = A.juan, cuando = ult ? (A.diasJuan === 0 ? 'hoy' : A.diasJuan === 1 ? 'ayer' : 'hace ' + A.diasJuan + ' días') : '';
    h += '<div class="fold open' + (A.tocaJuan ? ' amar' : '') + '"><div class="rows" style="padding-top:14px"><div class="kick">Cada 15 días · Juan</div>' +
      '<div class="row" style="border:0;padding:8px 0"><div><b>' + (ult ? 'Le preguntaste ' + cuando : 'Todavía no le preguntaste a Juan') + '</b>' + (ult ? '<div class="m">Dijo: ' + RJ[ult.resp][1].toLowerCase() + (ult.texto ? ' · ' + esc(ult.texto) : '') + '</div>' : '') +
      '<div class="m">' + (A.tocaJuan || A.diasJuan == null ? 'Toca preguntarle cómo viene la pauta.' : 'La próxima consulta es en ' + (14 - A.diasJuan) + ' día' + (14 - A.diasJuan === 1 ? '' : 's') + '.') + '</div></div>' +
      '<button class="btn' + (A.tocaJuan ? '' : ' g') + '" data-juan>Preguntarle a Juan ↗</button></div>' +
      '<label class="lt">¿Qué te dijo?</label><div class="seg2" data-pj>' + Object.keys(RJ).map(k => '<button data-v="' + k + '" class="' + (r.resp === k ? 'on' : '') + '">' + RJ[k][1] + '</button>').join('') + '</div>' +
      (r.resp && r.resp !== 'bien' ? '<textarea id="pjTxt" rows="2" style="margin-top:6px" placeholder="' + (r.resp === 'nuevo' ? 'Qué contenido hace falta (ej.: un reel nuevo de la promo, más historias con precio)' : 'Qué hay que iterar (ej.: cambiar el gancho de los primeros segundos)') + '">' + esc(r.jtxt) + '</textarea>' : '') +
      '<div class="bts" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-pjg' + (r.resp ? '' : ' disabled') + '>Guardar lo que dijo Juan</button></div></div></div>';
    const fila = x => { const v = x.r; const txt = !v ? '' : v.corriendo || (v.texto || (v.ok ? 'Revisada: todo bien' : '')); return '<div class="row"><div>Semana del ' + dm(x.sem) + (txt ? '<div class="m">' + esc(txt) + '</div>' : '') + '</div><span class="st ' + (v ? 'ok' : 'bad') + '">' + (v ? 'Anotada' : 'Sin anotar') + '</span></div>'; };
    h += fold('ph:' + m.slug, '', 'Últimas semanas', null, '<div class="rows">' + A.hist.map(fila).join('') + '</div>', false);
    if (A.juanHist && A.juanHist.length) h += fold('pj:' + m.slug, '', 'Lo que dijo Juan', A.juanHist.length, '<div class="rows">' + A.juanHist.map(j => '<div class="row"><div>' + dm(j.t.slice(0, 10)) + (j.texto ? '<div class="m">' + esc(j.texto) + '</div>' : '') + '</div><span class="st ' + RJ[j.resp][0] + '">' + RJ[j.resp][1] + '</span></div>').join('') + '</div>', false);
    return h;
  }
  function bindPauta() {
    const slug = S.marca, A = pautaDe(slug), r = PA[slug]; if (!A || !r) return;
    const leer = () => { const t = app.querySelector('#paTxt'); if (t) r.texto = t.value; const j = app.querySelector('#pjTxt'); if (j) r.jtxt = j.value; };
    const post = body => fetch(C.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: 'pauta', k: clave(), persona: S.persona, marca: slug }, body)) }).then(x => x.json()).then(x => { if (x.error) throw new Error(x.mensaje || x.error); return x; });
    app.querySelectorAll('[data-pedit]').forEach(b => b.onclick = () => { r.edit = true; pintar(); });
    app.querySelectorAll('[data-pcancel]').forEach(b => b.onclick = () => { r.edit = false; r.texto = A.esta.corriendo; pintar(); });
    app.querySelectorAll('[data-pg]').forEach(b => b.onclick = async () => {
      leer(); if (r.texto.trim().length < 4) return toast('Contá qué se está corriendo (qué pieza o campaña)');
      b.disabled = true;
      try { await post({ texto: r.texto.trim() }); A.esta = { corriendo: r.texto.trim(), t: new Date().toISOString() }; A.hist[0].r = A.esta; r.edit = false; toast('Guardado'); pintar(); } catch (e) { toast(e.message); b.disabled = false; }
    });
    app.querySelectorAll('[data-pj] button').forEach(b => b.onclick = () => { leer(); r.resp = b.dataset.v; pintar(); });
    app.querySelectorAll('[data-juan]').forEach(b => b.onclick = async () => {
      const msg = (S.pauta.juan ? '<@' + S.pauta.juan + '> ' : '@Juan ') + '¿Cómo viene la pauta de ' + A.nombre + '? Ahora se está corriendo: ' + (A.esta && A.esta.corriendo ? A.esta.corriendo : '(contame)') + '. ¿Hace falta otro contenido o iterar algo?';
      try { await navigator.clipboard.writeText(msg); toast('Mensaje copiado: pegalo en el canal'); } catch (e) { prompt('Copiá el mensaje:', msg); }
      if (A.link) window.open(A.link, '_blank', 'noopener'); else toast('No encuentro el canal ads de la marca: mandáselo a Juan por Discord');
    });
    app.querySelectorAll('[data-pjg]').forEach(b => b.onclick = async () => {
      leer(); if (r.resp !== 'bien' && r.jtxt.trim().length < 5) return toast('Contá qué contenido hace falta o qué hay que iterar');
      b.disabled = true;
      try { await post({ accion: 'juan', resp: r.resp, texto: r.resp === 'bien' ? '' : r.jtxt.trim() }); const j = { t: new Date().toISOString(), resp: r.resp, texto: r.resp === 'bien' ? '' : r.jtxt.trim() }; A.juan = j; A.juanHist = [j].concat(A.juanHist || []).slice(0, 4); A.tocaJuan = false; A.diasJuan = 0; r.resp = ''; r.jtxt = ''; toast('Anotado'); pintar(); } catch (e) { toast(e.message); b.disabled = false; }
    });
  }
  /* ---------- campañas del mes (Fase 3) ---------- */
  const campDe = slug => S.camp && S.camp.marcas.find(x => x.slug === slug);
  const NIVC = { 1: ['bad', 'N1 · mayor'], 2: ['mid', 'N2 · especial'], 3: ['ok', 'N3 · publicación'], 4: ['nd', 'N4 · mención'] };
  async function enviarCamp(body) {
    const r = await fetch(C.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: 'campana', k: clave(), persona: S.persona, marca: S.marca }, body)) }).then(r => r.json());
    if (r.error) throw new Error(r.mensaje || r.error); return r;
  }

    if (S.vista === 'anual') { app.innerHTML = h + pintarCamp(m); bind(); bindCamp(); return; }
    if (S.vista === 'mes') { app.innerHTML = h + paso('2', 'Calendario mensual', 'Qué tenés que mover este mes: tus tópicos fijos (lo que va sí o sí todas las semanas, con 5 formas distintas de moverlo, que se anotan a principio de mes y se vuelven tarjetas), la información que necesitás pedir para hacer bien tu trabajo y lo que aprendiste de los reportes.') + pintarGeneral(m) + pintarFicha(m); bind(); bindCamp(); bindFicha(); return; }
    if (S.vista === 'entregas') { app.innerHTML = h + pintarEntregas(m); bind(); bindEntregas(m); return; }
    if (S.vista === 'ads') { app.innerHTML = h + pintarPauta(m); bind(); bindPauta(); return; }
    if (S.vista === 'reels') { app.innerHTML = h + pintarReels(m); bind(); bindPB(); return; }
    // Cumplimiento: el mes que se mira (este o el pasado) se elige acá adentro
    h += '<div class="seg"><button data-mes="actual" class="' + (S.mes === 'actual' ? 'on' : '') + '">Este mes</button><button data-mes="anterior" class="' + (S.mes === 'anterior' ? 'on' : '') + '">Mes pasado</button></div><p class="sub">Cumplimiento de ' + MES[Number(D.mes.slice(5)) - 1] + ': lo mide el panel solo con Trello, el calendario y los reportes. No tenés que cargar nada acá.</p>';
    const topPct = Fm && Fm.aprobada && Fm.avance.length ? Math.round(Fm.avance.filter(a => a.ok).length / Fm.avance.length * 100) : null;
    const ent = m.entregas, cal = ent.filter(e => e.tipo === 'calendario'), ree = ent.filter(e => e.tipo === 'reels');
    h += '<div class="kpis">' + kpi(m.ind.entregas, 'Entregas', cal.length + ' de calendario' + (m.reels ? ' · ' + ree.length + ' de reels' : '')) + kpi(m.ind.reportes, 'Reportes a tiempo', m.reportes.length + ' en el mes') +
      kpi(m.ind.inputs, 'Inputs en 24 h', m.inputs.total ? m.inputs.ok + ' de ' + m.inputs.total : 'sin inputs medidos') + kpiPlan(m) + (topPct != null ? kpi(topPct, 'Tópicos fijos', Fm.avance.filter(a => a.ok).length + ' de ' + Fm.avance.length + ' al día') : kpi(null, 'Tópicos fijos', Fm && Fm.estado !== 'aprobada' ? 'falta aprobar la ficha' : 'armá la ficha de la marca', true)) + '</div>';
    const al = [];
    ent.filter(e => e.estado === 'incumplida').forEach(e => al.push(e.tipo === 'calendario' ? nombreEnt(e, ent) + ' (' + diaDe(e.f) + ' ' + dm(e.f) + '): quedó cargado hasta el ' + dm(e.hasta) + ' y tenía que llegar al ' + dm(e.obj) + '.' : nombreEnt(e, ent) + ' (' + diaDe(e.f) + ' ' + dm(e.f) + '): había ' + e.n + ' de ' + e.obj + '.'));
    m.reportes.filter(r => r.estado === 'falta').forEach(r => al.push('Falta el reporte ' + r.tipo + ' (' + (r.tipo === 'semanal' ? 'semana del ' + dm(r.per) : r.per) + '), vencía el ' + dm(r.vence.slice(0, 10)) + '.'));
    if (m.inputs.tarde.length) al.push(m.inputs.tarde.length + ' input' + (m.inputs.tarde.length === 1 ? '' : 's') + ' se marcaron después de 24 h (o todavía no se marcaron).');
    if (al.length) h += fold('al:' + m.slug, 'roja', 'Alertas', al.length, '<div class="al"><ul>' + al.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>', true);
    h += fold('en:' + m.slug, '', 'Entregas del mes', ent.length, '<div class="rows">' + (ent.length ? ent.map(e => filaE(e, ent)).join('') : '<div class="row"><div class="m">No hay entregas este mes en el calendario.</div></div>') + '</div>', false);
    h += fold('re:' + m.slug, '', 'Reportes', m.reportes.length, '<div class="rows">' + (m.reportes.length ? m.reportes.map(filaR).join('') : '<div class="row"><div class="m">Esta marca no tiene reportes en el sistema de Reportes.</div></div>') + '</div>', false);
    h += '<p class="pie">El panel mide desde el ' + dm(D.desde) + '/2026: las entregas anteriores figuran "sin medir". Estos números todavía no cuentan para el bono (eso arranca en enero de 2027).</p>';
    app.innerHTML = h; bind();
  }
  function bind() {
    document.querySelectorAll('.paso').forEach(x => x.onclick = () => x.classList.toggle('ver'));   // en el celu la explicación se abre al tocar
    app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.marca = b.dataset.m; lsSet('plan:marca', S.marca); pintar(); });
    app.querySelectorAll('[data-mes]').forEach(b => b.onclick = () => { if (S.mes === b.dataset.mes) return; S.mes = b.dataset.mes; cargar(); });
    app.querySelectorAll('[data-guia]').forEach(b => b.onclick = guia);
    app.querySelectorAll('[data-phall]').forEach(b => b.onclick = () => { S.phAll = !S.phAll; pintar(); });
    // fuera de Cumplimiento siempre se mira el mes actual (el "mes pasado" es solo para medir)
    const irA = v => { S.vista = v; lsSet('plan:vista', v); if (v !== 'cumple' && S.mes !== 'actual') { S.mes = 'actual'; return cargar(); } pintar(); };
    app.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { const [slug, v] = b.dataset.ir.split('|'); S.marca = slug; lsSet('plan:marca', slug); if (S.vista === 'mes' && v !== 'mes' && sucio(S.marca) && !confirm('Tenés cambios sin guardar en la ficha. ¿Salir igual?')) return; irA(vistaOk(v) || 'anual'); const vs = app.querySelector('.vseg'); if (vs) vs.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    if (lsGet('plan:guia') !== '2' && !document.querySelector('.modal')) setTimeout(guia, 400);
    app.querySelectorAll('[data-vista]').forEach(b => b.onclick = () => { if (S.vista === b.dataset.vista) return; if (S.vista === 'mes' && sucio(S.marca) && !confirm('Tenés cambios sin guardar en la ficha. ¿Salir igual?')) return; irA(b.dataset.vista); });
    app.querySelectorAll('[data-fold]').forEach(b => b.onclick = () => { const f = b.parentElement; f.classList.toggle('open');
      if (MOVIL() && f.classList.contains('open') && b.dataset.fold !== 'ph') app.querySelectorAll('.fold.open > [data-fold]').forEach(o => { if (o !== b && o.dataset.fold !== 'ph') { o.parentElement.classList.remove('open'); S.folds[o.dataset.fold] = false; } }); S.folds[b.dataset.fold] = f.classList.contains('open'); lsSet('plan:folds', JSON.stringify(S.folds)); });
  }
  cargar();
})();
</script>
