<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="robots" content="noindex">
<title>Cómo se arma un mes · Ideamia</title>
<link rel="icon" type="image/png" sizes="192x192" href="../../icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
:root{--bg:#0A0A0A;--c1:#141414;--c2:#1C1C1C;--c3:#242424;--ln:#262626;--tx:#F5F5F5;--mu:#8C8C8C;--y:#FFF200;--ok:#5CE38A;--warn:#FFB454;--bad:#FF6B6B;--sky:#6FC3FF;--pink:#FF8AD8;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Outfit,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
/* mapa de piezas (arriba, siempre visible) */
.mapa{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.mapa .in{max-width:1100px;margin:0 auto;padding:10px 16px 8px;display:flex;align-items:center;gap:12px}
.nodos{flex:1;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;padding:4px 2px}.nodos::-webkit-scrollbar{display:none}
.nodo{flex:none;display:flex;align-items:center;border:0;background:none;padding:0}
.nodo i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;background:var(--c2);border:1px solid var(--ln);transition:all .35s cubic-bezier(.2,.8,.2,1)}
.nodo.hecho i{background:rgba(255,242,0,.14);border-color:rgba(255,242,0,.5)}
.nodo.on i{background:var(--y);border-color:var(--y);transform:scale(1.18);box-shadow:0 0 0 6px rgba(255,242,0,.12)}
.nodo b{display:block;width:16px;height:2px;background:var(--ln);transition:background .4s}.nodo.hecho b{background:rgba(255,242,0,.55)}.nodo:last-child b{display:none}
.ej-sw{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--c1);border-radius:999px;padding:6px 12px 6px 6px;font-size:12.5px;font-weight:600}
.ej-sw .t{width:34px;height:20px;border-radius:999px;background:var(--c3);position:relative;transition:background .25s}.ej-sw .t:after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#777;transition:all .25s}
.ej-sw.on .t{background:var(--y)}.ej-sw.on .t:after{left:17px;background:#0A0A0A}
@media(max-width:640px){.ej-sw span.l{display:none}.ej-sw{padding:6px}}
/* escena */
.stage{max-width:1100px;margin:0 auto;padding:22px 16px 120px;min-height:calc(100vh - 60px)}
.esc{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
@media(max-width:860px){.esc{grid-template-columns:1fr;gap:18px}}
.cuando{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--y);background:rgba(255,242,0,.08);border:1px solid rgba(255,242,0,.25);border-radius:999px;padding:5px 11px}
h1,h2{font:400 54px/.95 'Bebas Neue',sans-serif;letter-spacing:.01em;margin:12px 0 10px}h1 b,h2 b{color:var(--y);font-weight:400}
@media(max-width:600px){h1,h2{font-size:42px}}
.bajada{color:#cfcfcf;font-size:16.5px;margin:0 0 16px;max-width:560px}
.lista{list-style:none;margin:0;padding:0}.lista li{position:relative;padding:10px 0 10px 30px;border-top:1px solid var(--ln);font-size:15px}.lista li:first-child{border-top:0}
.lista li:before{content:'';position:absolute;left:4px;top:17px;width:10px;height:10px;border-radius:3px;background:var(--y);transform:rotate(45deg)}
.lista li small{display:block;color:var(--mu);font-size:13px}
.regla{margin-top:14px;border-left:3px solid var(--bad);background:rgba(255,107,107,.07);border-radius:0 12px 12px 0;padding:10px 14px;font-size:14px}.regla b{color:var(--bad)}
.panel-btn{margin-top:16px;display:inline-flex;align-items:center;gap:10px;background:var(--y);color:#0A0A0A;border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;box-shadow:0 10px 30px rgba(255,242,0,.15);transition:transform .2s}
.panel-btn:hover{transform:translateY(-2px)}.panel-btn.off{background:var(--c3);color:var(--tx);box-shadow:none}
/* lado derecho: la animación o el ejemplo */
.vis{position:relative;background:var(--c1);border:1px solid var(--ln);border-radius:24px;padding:18px;min-height:360px;overflow:hidden}
.vis .tag{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.ej{background:linear-gradient(180deg,rgba(255,242,0,.06),rgba(255,242,0,0) 60%),var(--c1);border-color:rgba(255,242,0,.35)}
.ej .quien{display:flex;align-items:center;gap:10px;margin-bottom:10px}.ej .quien .av{width:36px;height:36px;border-radius:50%;background:var(--y);color:#0A0A0A;display:grid;place-items:center;font:400 20px 'Bebas Neue'}
.ej .quien div{font-size:12.5px;color:var(--mu)}.ej .quien b{display:block;color:var(--tx);font-size:14px}
.voz{font-size:15px;color:#e9e9e9;border-left:2px solid var(--y);padding:2px 0 2px 12px;margin:10px 0;font-style:italic}
.campo{background:var(--c2);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin:8px 0}.campo .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.chip{font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--c3)}
.chip.si{background:rgba(92,227,138,.15);color:var(--ok)}.chip.no{background:rgba(255,107,107,.13);color:var(--bad)}.chip.y{background:var(--y);color:#0A0A0A}
.nota{font-size:12.5px;color:var(--warn);margin-top:8px}
.ejt{font-size:15px;color:#e6e6e6;margin:8px 0;line-height:1.55}
/* piezas animadas */
.anim .pz{animation:entra .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 110ms + 120ms)}
@keyframes entra{from{opacity:0;transform:translateY(18px) scale(.97)}}
.flujo{display:flex;flex-direction:column;gap:10px}
.fl{display:flex;align-items:center;gap:12px;background:var(--c2);border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
.fl .ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--c3)}
.fl b{display:block;font-size:14px}.fl span{font-size:12.5px;color:var(--mu)}
.fl.y{border-color:rgba(255,242,0,.4)}.fl.y .ic{background:var(--y)}
/* mini calendario */
.vis .cal{margin-top:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
@media(max-width:600px){.cal{gap:3px}.cal .c{min-height:44px;padding:3px;border-radius:7px}.cal .p{font-size:8px;padding:1px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vis{padding:12px}}
.cal .d{font-size:10.5px;color:var(--mu);text-align:center;font-weight:700;padding-bottom:2px}
.cal .c{min-height:54px;background:var(--c2);border:1px solid var(--ln);border-radius:9px;padding:4px;font-size:10px;position:relative}
.cal .c .n{color:#666;font-weight:700}
.cal .p{display:block;margin-top:3px;border-radius:5px;padding:2px 4px;font-weight:700;font-size:9.5px;line-height:1.2}
.anim .cal .p{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i,0) * 70ms + 300ms)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.p.ddl{background:var(--y);color:#0A0A0A}.p.pro{background:rgba(255,138,216,.2);color:var(--pink)}.p.env{background:rgba(111,195,255,.18);color:var(--sky)}.p.web{background:rgba(92,227,138,.16);color:var(--ok)}.p.maq{background:rgba(255,180,84,.18);color:var(--warn)}.p.of{background:#2e2e2e;color:#ddd}
.cal .c.hoy{border-color:var(--y)}
.ley{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:11.5px;color:var(--mu)}.ley i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* lista de Trello */
.trello{background:#0e0e0e;border-radius:16px;padding:10px;border:1px solid var(--ln)}
.trello .h{font-size:12.5px;font-weight:700;margin:2px 4px 8px}
.tc{background:var(--c2);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px;border:1px solid var(--ln)}
.anim .tc{animation:vuela .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 160ms + 250ms)}
@keyframes vuela{from{opacity:0;transform:translateX(40px) rotate(3deg)}}
.tc small{display:block;color:var(--mu);font-size:11.5px}.tc .lb{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:4px;background:#5a4bd1;color:#fff}
/* línea que se dibuja (intro) */
.camino{width:100%;height:auto;display:block}
.camino path.l{fill:none;stroke:var(--y);stroke-width:3;stroke-linecap:round;stroke-dasharray:1400}
.anim .camino path.l{animation:dibuja 2.4s cubic-bezier(.6,.1,.3,1) .2s both}@keyframes dibuja{from{stroke-dashoffset:1400}}
.anim .camino g.n{animation:aparece .5s ease both;animation-delay:calc(var(--i) * 230ms + 400ms)}@keyframes aparece{from{opacity:0}}
.camino text{fill:var(--tx);font:600 13px Outfit}.camino text.s{fill:var(--mu);font-size:11px;font-weight:500}
/* pie de navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(10,10,10,1) 55%,rgba(10,10,10,0))}
.nav .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.nav .pg{flex:1;height:4px;background:var(--c3);border-radius:9px;overflow:hidden}.nav .pg i{display:block;height:100%;background:var(--y);border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.nav .cnt{font-size:12.5px;color:var(--mu);font-weight:600;min-width:44px;text-align:center}
.bt{border:1px solid var(--ln);background:var(--c1);border-radius:14px;padding:12px 18px;font-weight:700}.bt.y{background:var(--y);color:#0A0A0A;border-color:var(--y)}.bt:disabled{opacity:.35;cursor:default}
.saltar{position:fixed;right:16px;top:70px;z-index:19}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pz,.tc,.cal .p,.camino g.n{opacity:1!important;transform:none!important}.camino path.l{stroke-dashoffset:0!important}}
/* transición entre escenas */
.esc.sale{animation:sale .28s ease forwards}@keyframes sale{to{opacity:0;transform:translateX(var(--dx,-30px))}}
.esc.entra-izq{animation:entraI .45s cubic-bezier(.2,.8,.2,1)}@keyframes entraI{from{opacity:0;transform:translateX(-40px)}}
.esc.entra-der{animation:entraD .45s cubic-bezier(.2,.8,.2,1)}@keyframes entraD{from{opacity:0;transform:translateX(40px)}}
.semana{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--ln)}.semana:first-of-type{border-top:0}.semana .s{font:400 22px/1 'Bebas Neue';color:var(--y)}
.semana .s small{display:block;font:600 10.5px Outfit;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
</style>
<script src="../../ideamia-nav.js?v=4" defer></script>
</head>
<body>
<div class="mapa"><div class="in"><div class="nodos" id="nodos"></div><button class="ej-sw" id="ejsw" title="Mostrar en cada paso cómo lo hizo Joaquín con Isco"><span class="t"></span><span class="l">Ejemplo Isco</span></button></div></div>
<main class="stage" id="stage"></main>
<div class="nav"><div class="in"><button class="bt" id="atras">← Atrás</button><div class="pg"><i id="pg"></i></div><span class="cnt" id="cnt"></span><button class="bt y" id="sig">Siguiente →</button></div></div>
<script>
(function () {
  /* Cada escena es una pieza del recorrido. "ej" es cómo lo armó Joaquín para Isco y el Día del Dulce de Leche (contado por él, 17/10/2026). */
  const J = '<div class="quien"><span class="av">J</span><div><b>Ejemplo: cómo lo armó Joaquín</b>Isco · Día del Dulce de Leche (11/10, nivel 2)</div></div>';
  const P = t => '<p class="ejt">' + t + '</p>';
  const E = [
    { ic: '🧭', cuando: 'Antes de empezar', t: 'Cómo se arma <b>un mes</b>', bajada: 'Este es el recorrido que sigue cada social media para que el calendario salga ordenado y no se escape nada. Algunas piezas se hacen una sola vez, otras todos los meses y otras todas las semanas.',
      que: ['Tocá <b>Siguiente</b> para recorrerlo paso a paso, o tocá un círculo de arriba para ir directo a una pieza.', 'Prendé <b>Ejemplo Isco</b> (arriba a la derecha) para ver, en cada paso, cómo armó Joaquín el Día del Dulce de Leche.', 'Todo se carga en <b>Plan</b>: el panel te recuerda las fechas y crea las tarjetas por vos.'],
      vis: 'camino', ej: J + P('Joaquín armaba así cada mes cuando era social media: miraba el calendario anual, veía qué fecha venía y la preparaba paso a paso. El ejemplo es de Isco, pero la estructura es la misma para todas las marcas.') + P('Lo que cambia de una marca a otra es el contenido: los tópicos, los ángulos y las ideas los define cada social media según su estrategia.') },
    { ic: '📋', cuando: 'Una vez por marca', t: 'La <b>ficha</b> de la marca', bajada: 'Reúne lo que se mueve sí o sí todas las semanas, lo que hay que pedir siempre y lo que aprendiste de tus reportes. Se arma una vez, la aprueba Joaquín y queda como base para todos los meses.',
      que: ['<b>Tópicos fijos</b>: qué días se mueven, cuántas veces y <b>al menos 5 ángulos</b> distintos para cada uno.<small>Sin 5 ángulos no se puede guardar.</small>', '<b>Pedidos recurrentes</b>: qué se pide, a quién, cuándo y por dónde insistir si no responden.', '<b>Aprendizajes</b> de los reportes: qué hacer más, qué hacer menos y qué dejar de hacer, con frecuencia y vigencia.'],
      regla: 'Con la ficha aprobada, el panel te recuerda los pedidos el día anterior y cuenta lo que movés con la etiqueta "Tópico · …".', donde: 'Plan → Ficha',
      vis: 'ficha', ej: J + '<div class="campo"><div class="k">Promo del día · miércoles y sábado</div>Producto con descuento y precio final (un producto de $50.000 queda en $45.000) · medios de pago que aceptan · la promo en una placa · video de alguien contando la promo · clientes aprovechándola, local lleno</div>' +
        '<div class="campo"><div class="k">Envíos · martes y jueves · 2 o 3 veces al mes</div>Recordar que se puede pedir y llega a domicilio · qué días se hacen los envíos · cómo hacer el pedido</div>' +
        '<div class="campo"><div class="k">Web · 6 veces al mes, un día por semana que va rotando</div>Productos de la web · la sección de ofertas · recursos de la web · productos en promo en el local que también están en la web</div>' +
        '<div class="campo"><div class="k">Maquinarias · una vez por semana</div>Semana 1: maquinarias para panadería · semana 2: para pastelería · semana 3: toda la línea · semana 4: el sector de maquinarias del local</div>' +
        '<div class="campo"><div class="k">Oferta del mes</div>Se publica en el feed la primera semana del mes.</div>' +
        '<div class="campo"><div class="k">Pedidos recurrentes</div>El día 1, la promo del mes al project (si no llega, se pide en el canal de la marca) · al cliente: qué maquinarias de panadería y de pastelería mover y qué ofertas hay en el mes</div>' +
        '<div class="campo"><div class="k">Aprendizaje</div>Los juegos en historias funcionaron: mover más juegos, 2 por semana.</div>' },
    { ic: '🔔', cuando: 'Día 1 de cada mes', t: 'El panel te <b>avisa</b> qué viene', bajada: 'El primer día hábil del mes te llega por Discord qué campañas tenés este mes y cuáles el mes que viene, según el calendario anual de la marca. Con ese aviso empieza el plan del mes siguiente.',
      que: ['Cada campaña viene con su nivel (N1, N2, N3 o N4).', 'Si no hay campañas, el mes se organiza con los <b>tópicos fijos</b> de la ficha.', 'Las campañas N1 y N2 llevan brainstorming: programala con tiempo y avisale al equipo con 24 horas de anticipación.'],
      donde: 'Discord (privado) y Plan → Campañas', vis: 'aviso',
      ej: J + P('El mes que viene es el Día del Dulce de Leche, una campaña de nivel 2.') + '<div class="campo"><div class="k">Por qué le importa a Isco</div>Isco vende Vacalín (es distribuidor oficial) y otras marcas de dulce de leche, así que la fecha le queda perfecta.</div>' },
    { ic: '🎯', cuando: 'Día 1 de cada mes', t: '¿La <b>atacamos</b>?', bajada: 'Por cada fecha del calendario anual decidís si se ataca o no. Si no, el motivo es obligatorio y Joaquín lo aprueba o lo rechaza.',
      que: ['<b>La atacamos</b>: pasa al plan del mes.', '<b>No la atacamos</b>, con el motivo (por ejemplo: el cliente no quiere, o no tiene relación con la marca).', 'Si Joaquín rechaza el descarte, la campaña vuelve al plan y te llega el aviso.'],
      donde: 'Plan → Campañas', vis: 'decision',
      ej: J + '<div class="campo"><div class="k">Día del Dulce de Leche · N2</div><span class="chip si">La atacamos</span> Isco vende dulce de leche: se ataca sí o sí.</div><div class="campo"><div class="k">Día del Vegetariano (ejemplo de descarte)</div><span class="chip no">No la atacamos</span> No tiene relación con la marca. Joaquín revisa el motivo.</div>' },
    { ic: '🔍', cuando: 'Plan del mes · paso 1', t: 'Mirá a la <b>competencia</b>', bajada: 'Elegí entre 3 y 5 marcas del rubro (competencia directa o referencias que inspiren) y anotá qué hizo cada una para esa fecha. Con menos de 3 no se puede avanzar.',
      que: ['Revisá su Instagram y la biblioteca de anuncios de Meta.', 'Anotá <b>qué hizo cada una</b>: formato, idea, promo o colaboración.', 'La idea es inspirarse para tu marca, no copiar.'],
      regla: '<b>Obligatorio:</b> sin 3 referencias con lo que hizo cada una, el plan no avanza.', donde: 'Plan → Campañas → Armar el plan', vis: 'comp',
      ej: J + P('Para el Día del Dulce de Leche, Joaquín revisaba qué hacían y qué habían hecho el año anterior estas marcas, y cómo lo habían comunicado:') + '<div class="chips"><span class="chip y">Vacalín</span><span class="chip y">Puratos</span><span class="chip y">Rich's</span><span class="chip y">Tonadita</span><span class="chip y">Ramolac</span><span class="chip y">La Serenísima</span><span class="chip y">Spalen</span><span class="chip">Panaderías de la zona</span></div><p class="nota">Son marcas de dulce de leche que vende Isco (están en su web): sirve ver qué comunican ellas para la fecha.</p>' },
    { ic: '📈', cuando: 'Plan del mes · paso 2', t: 'Qué hicimos el <b>año pasado</b>', bajada: 'Qué se publicó, por dónde (feed, historias o una activación) y cómo funcionó. Si la marca es nueva para nosotros, qué hizo la marca. Si no se hizo nada, también vale.',
      que: ['Revisá las métricas y los reportes del año anterior.', 'Mirá qué funcionó y qué no, en feed, historias y activaciones.', 'Opción válida: <b>"No se hizo nada"</b>.'],
      donde: 'Plan del mes · paso 2', vis: 'metricas',
      ej: J + P('Joaquín revisaba las métricas de Isco del año anterior: qué se había publicado para el Día del Dulce de Leche, si fue por historias o por feed, y qué había funcionado mejor.') + '<p class="nota">El dato puntual de lo que hizo Isco el año pasado se completa al armar el plan.</p>' },
    { ic: '💡', cuando: 'Plan del mes · paso 3', t: 'Todas las <b>ideas</b>', bajada: 'Una lista libre con todo lo que se te ocurra para mover la fecha. Si querés ayuda, el botón Preguntale a Claude se abre con la marca, la fecha, la competencia y el año pasado ya escritos.',
      que: ['Promos, reels, carruseles, historias, recetas, colaboraciones, acciones en el local o en la web.', 'Lo que sugiere Claude es una ayuda: las ideas las elegís vos.', 'Pensá en la marca: lo que funciona para una no siempre sirve para otra.'],
      donde: 'Plan del mes · paso 3', vis: 'ideas',
      ej: J + '<div class="chips">' + ['Publicar promos de dulce de leche', 'Reel con los beneficios del dulce de leche', 'Carrusel con los tipos de dulce de leche y para qué conviene cada uno', 'Una receta con dulce de leche', 'Mandar muestras a influencers o panaderos para que cocinen algo y lo publiquen en colaboración', 'Influencers que muestren o sorteen dulce de leche', 'Degustación en el local', 'Historias sobre los distintos tipos de dulce de leche', 'Pedirle al cliente promos y descuentos', 'Una sección de la web solo de dulce de leche', 'Preguntar qué dulce de leche conviene empujar'].map((x, i) => '<span class="chip pz" style="--i:' + i + '">' + x + '</span>').join('') + '</div>' },
    { ic: '🎨', cuando: 'Plan del mes · paso 4', t: '¿Necesita <b>producción</b>?', bajada: 'Tres preguntas de sí o no. Cada "sí" se convierte en una tarjeta para Diseño con su etiqueta. Si tenés dudas, consultalo con el project.',

  let x0 = null; stage.addEventListener('touchstart', ev => { x0 = ev.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', ev => { if (x0 == null) return; const dx = ev.changedTouches[0].clientX - x0; if (Math.abs(dx) > 70) ir(i + (dx < 0 ? 1 : -1)); x0 = null; }, { passive: true });
  pintar();
})();
</script>
